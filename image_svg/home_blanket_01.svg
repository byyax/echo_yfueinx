<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title desc">
  <title id="title">沙发上的两条毯子</title>
  <desc id="desc">客厅沙发一角，扶手上搭着两条折叠的毯子，旁边有两只抱枕和一个遥控器，傍晚的光落在座垫上。</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8E2D6"/>
      <stop offset="1" stop-color="#D4CBBB"/>
    </linearGradient>
    <linearGradient id="sofa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8C9A86"/>
      <stop offset="1" stop-color="#68785F"/>
    </linearGradient>
    <linearGradient id="seat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9DAA94"/>
      <stop offset="1" stop-color="#7C8B72"/>
    </linearGradient>
    <linearGradient id="throw1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D7B18C"/>
      <stop offset=".55" stop-color="#C1936C"/>
      <stop offset="1" stop-color="#A87956"/>
    </linearGradient>
    <linearGradient id="throw2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8E2D2"/>
      <stop offset="1" stop-color="#BFB6A2"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6A57F"/>
      <stop offset="1" stop-color="#9B7552"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".12"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#wall)"/>
  <rect y="478" width="800" height="122" fill="url(#floor)"/>
  <path d="M0 478h800v10H0z" fill="#E0C6A6" opacity=".55"/>

  <!-- 沙发主体 -->
  <g>
    <ellipse cx="406" cy="520" rx="336" ry="48" fill="#493A2E" opacity=".25" filter="url(#soft)"/>
    <rect x="96" y="286" width="608" height="220" rx="34" fill="url(#sofa)"/>
    <rect x="96" y="286" width="608" height="54" rx="27" fill="#A2AE99" opacity=".55"/>
    <rect x="120" y="424" width="560" height="112" rx="30" fill="url(#seat)"/>
    <path d="M120 454q140-20 280 0t280 0v70H120z" fill="#87957C" opacity=".55"/>
    <path d="M396 446v90" stroke="#5E6E55" stroke-width="4" opacity=".35"/>
    <g fill="#B8C2AD" opacity=".25">
      <ellipse cx="230" cy="482" rx="70" ry="9"/>
      <ellipse cx="570" cy="482" rx="70" ry="9"/>
    </g>
  </g>

  <!-- 左扶手 -->
  <g>
    <rect x="62" y="260" width="104" height="252" rx="38" fill="#7D8B72"/>
    <rect x="74" y="274" width="80" height="50" rx="24" fill="#A3AF98" opacity=".5"/>
    <path d="M80 484v58" stroke="#54453A" stroke-width="14" stroke-linecap="round"/>
  </g>

  <!-- 抱枕 -->
  <g transform="translate(208 376) rotate(-8)">
    <rect x="-78" y="-68" width="156" height="136" rx="30" fill="#B88762"/>
    <rect x="-66" y="-56" width="132" height="112" rx="24" fill="#CFA17C"/>
    <path d="M-40-14q40-28 80 0M-40 22q40 24 80 0" fill="none" stroke="#E5C3A4" stroke-width="4" opacity=".55"/>
  </g>
  <g transform="translate(326 396) rotate(6)">
    <rect x="-66" y="-58" width="132" height="116" rx="26" fill="#D8D2C3"/>
    <rect x="-55" y="-47" width="110" height="94" rx="20" fill="#ECE7DB"/>
    <path d="M-34-10q34-22 68 0M-34 20q34 18 68 0" fill="none" stroke="#C5BDAC" stroke-width="4" opacity=".7"/>
  </g>

  <!-- 两条折叠毯子 -->
  <g transform="translate(500 354) rotate(-3)">
    <!-- 下层浅色毯子 -->
    <path d="M-118 2Q-82 -16 -20 -13Q56 -10 112 5L106 42Q52 57 -13 53Q-76 49 -112 33Z" fill="#C4B9A5"/>
    <path d="M-112 0Q-76 -12 -20 -10Q54 -7 106 8L103 31Q48 45 -16 42Q-76 38 -108 27Z" fill="url(#throw2)"/>
    <path d="M-102 2Q-62 -7 -18 -6Q48 -3 96 9" fill="none" stroke="#F5F1E8" stroke-width="5" opacity=".75"/>
    <path d="M-108 24Q-50 37 -10 38Q52 39 100 25" fill="none" stroke="#A99D88" stroke-width="4" opacity=".5"/>
    <g stroke="#9F9582" stroke-width="3" opacity=".42">
      <path d="M-82 7Q-38 16 8 15Q56 14 90 4M-72 30Q-28 38 14 36Q56 34 86 25"/>
    </g>
    <g stroke="#8E826F" stroke-width="3" opacity=".5">
      <path d="M-104 39v14M-88 42v14M-72 44v14M-56 46v14M-40 48v14M-24 49v14M-8 50v14M8 50v14M24 50v14M40 49v14M56 48v14M72 46v14M88 44v14M104 41v14"/>
    </g>

    <!-- 上层暖棕色毯子 -->
    <g transform="translate(2 -50) rotate(4)">
      <path d="M-96 2Q-66 -13 -20 -10Q42 -6 90 7L84 39Q38 51 -17 47Q-66 43 -90 31Z" fill="#936343"/>
      <path d="M-90 0Q-62 -9 -20 -7Q40 -3 84 9L81 30Q36 42 -18 39Q-64 35 -86 26Z" fill="url(#throw1)"/>
      <path d="M-82 1Q-48 -5 -16 -4Q38 -1 76 10" fill="none" stroke="#E7C4A2" stroke-width="4" opacity=".65"/>
      <path d="M-86 25Q-40 35 -14 36Q34 37 78 24" fill="none" stroke="#8A5A3C" stroke-width="4" opacity=".5"/>
      <g stroke="#E4C2A1" stroke-width="3" opacity=".4">
        <path d="M-66 5Q-28 13 8 12Q48 11 70 3M-58 27Q-20 34 12 32Q44 30 64 24"/>
      </g>
      <g stroke="#764A32" stroke-width="3" opacity=".55">
        <path d="M-84 40v14M-68 43v14M-52 45v14M-36 46v14M-20 47v14M-4 48v14M12 48v14M28 47v14M44 46v14M60 44v14M76 42v14"/>
      </g>
    </g>
  </g>

  <!-- 遥控器 -->
  <g transform="translate(492 430) rotate(-7)">
    <rect x="-24" y="-58" width="48" height="116" rx="18" fill="#3E3D3B"/>
    <rect x="-17" y="-49" width="34" height="98" rx="13" fill="#575654"/>
    <circle cx="0" cy="-26" r="9" fill="#C15A50"/>
    <g fill="#B8B6B0">
      <circle cx="-7" cy="-2" r="4"/><circle cx="7" cy="-2" r="4"/>
      <circle cx="-7" cy="16" r="4"/><circle cx="7" cy="16" r="4"/>
      <rect x="-10" y="32" width="20" height="7" rx="3"/>
    </g>
  </g>

  <!-- 暖光 -->
  <g fill="#FFE0A8" opacity=".16" filter="url(#soft)">
    <ellipse cx="238" cy="330" rx="150" ry="34" transform="rotate(-16 238 330)"/>
    <ellipse cx="612" cy="382" rx="94" ry="24" transform="rotate(-12 612 382)"/>
  </g>
  <rect width="800" height="600" filter="url(#grain)" opacity=".11" style="mix-blend-mode:soft-light"/>
</svg>
