<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title desc">
  <title id="title">靠窗的电脑桌：工作</title>
  <desc id="desc">米白色墙和百叶窗前的浅色电脑桌，屏幕里开着文档和表格，桌上有咖啡和笔记本。</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7EFDF"/>
      <stop offset="1" stop-color="#EADCC6"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8A6246"/>
      <stop offset="1" stop-color="#5E3F2B"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A3BD92"/>
      <stop offset="1" stop-color="#82A073"/>
    </linearGradient>
    <linearGradient id="ocean" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5FA8C4"/>
      <stop offset=".5" stop-color="#2E6E8E"/>
      <stop offset="1" stop-color="#1C465E"/>
    </linearGradient>
    <radialGradient id="screenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#A7D3E0" stop-opacity=".45"/>
      <stop offset=".65" stop-color="#6F9DB5" stop-opacity=".12"/>
      <stop offset="1" stop-color="#6F9DB5" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".14"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#wall)"/>

  <!-- 从画布顶部开始的大百叶窗：外面是蓝绿色，室内是奶油色 -->
  <g>
    <rect x="36" y="-20" width="764" height="420" fill="#4E86A0"/>
    <rect x="36" y="250" width="764" height="150" fill="#3F6F4A" opacity=".85"/>
    <g fill="#2F5A3C" opacity=".85">
      <circle cx="120" cy="300" r="54"/><circle cx="184" cy="284" r="42"/>
      <circle cx="650" cy="294" r="48"/><circle cx="720" cy="276" r="40"/>
    </g>
    <g fill="#A9BBC4">
      <rect x="36" y="0" width="764" height="15"/><rect x="36" y="20" width="764" height="15"/>
      <rect x="36" y="40" width="764" height="15"/><rect x="36" y="60" width="764" height="15"/>
      <rect x="36" y="80" width="764" height="15"/><rect x="36" y="100" width="764" height="15"/>
      <rect x="36" y="120" width="764" height="15"/><rect x="36" y="140" width="764" height="15"/>
      <rect x="36" y="160" width="764" height="15"/><rect x="36" y="180" width="764" height="15"/>
      <rect x="36" y="200" width="764" height="15"/><rect x="36" y="220" width="764" height="15"/>
      <rect x="36" y="240" width="764" height="15"/><rect x="36" y="260" width="764" height="15"/>
      <rect x="36" y="280" width="764" height="15"/><rect x="36" y="300" width="764" height="15"/>
      <rect x="36" y="320" width="764" height="15"/><rect x="36" y="340" width="764" height="15"/>
      <rect x="36" y="360" width="764" height="15"/><rect x="36" y="380" width="764" height="15"/>
    </g>
    <g stroke="#C9B99E" stroke-width="2" opacity=".45">
      <path d="M220 0v396M400 0v396M580 0v396"/>
    </g>
    <rect x="28" y="396" width="772" height="20" rx="3" fill="#E8DCC6"/>
    <path d="M28 396h772" stroke="#C9A57F" stroke-width="3" opacity=".55"/>
  </g>
  <!-- 左侧绿色窗帘，里面叠一层半透明白纱 -->
  <g>
    <path d="M58 0h82v430H58z" fill="#FFFFFF" opacity=".38"/>
    <g stroke="#FFFFFF" stroke-width="3" opacity=".45">
      <path d="M78 10V420M98 10V420M118 10V420"/>
    </g>
    <path d="M0 0h94v430H0z" fill="url(#green)"/>
    <g fill="none" stroke="#3F5A3D" stroke-width="3" opacity=".5">
      <path d="M20 20V420M44 20V420M68 20V420"/>
    </g>
    <path d="M0 0h94v38c-24 20-66 20-94 0z" fill="#A9C69A" opacity=".6"/>
  </g>

  <!-- 窗帘上的贴纸 -->
  <g>
    <path d="M24 132l5 10 11 2-8 8 2 11-10-5-10 5 2-11-8-8 11-2z" fill="#E8C94E" opacity=".95"/>
    <path d="M60 190l7 12-7 12-7-12z" fill="#E8A0A0" opacity=".9"/>
    <circle cx="34" cy="248" r="6" fill="#6F8CA8" opacity=".9"/>
    <path d="M68 284c8-8 20-6 24 2-7 5-17 6-24-2z" fill="#E8DFC8" opacity=".85"/>
  </g>
  <!-- 右侧百叶窗拉绳：从顶端直直垂下来 -->
  <g>
    <path d="M756 0v396" stroke="#6E5A46" stroke-width="3"/>
    <circle cx="756" cy="400" r="5" fill="#C9A57F"/>
  </g>

  <!-- 百叶窗上的便利贴，故意贴歪 -->
  <g>
    <g transform="rotate(-7 182 54)">
      <rect x="154" y="34" width="56" height="44" fill="#E8C94E"/>
      <path d="M166 48h30M166 58h22M166 68h28" stroke="#8A7A4A" stroke-width="2"/>
    </g>
    <g transform="rotate(6 560 46)">
      <rect x="532" y="24" width="54" height="44" fill="#E8A0A0"/>
      <path d="M544 38h28M544 48h20M544 58h26" stroke="#8E4A4A" stroke-width="2"/>
    </g>
    <g transform="rotate(-3 670 92)">
      <rect x="642" y="72" width="58" height="42" fill="#A9C6CE"/>
      <path d="M654 86h32M654 96h22M654 106h28" stroke="#4E6B7A" stroke-width="2"/>
    </g>
    <g transform="rotate(9 330 38)">
      <rect x="302" y="20" width="52" height="40" fill="#C9D6BE"/>
      <path d="M314 32h28M314 42h18M314 52h26" stroke="#4F6A4A" stroke-width="2"/>
    </g>
  </g>
  <!-- 桌面 -->
  <rect y="430" width="800" height="170" fill="url(#desk)"/>
  <path d="M0 430h800" stroke="#A87A56" stroke-width="4" opacity=".65"/>
  <g stroke="#4A3021" stroke-width="2" opacity=".3">
    <path d="M0 486H800M0 540H800M90 600L210 430M320 600L360 430M560 600L520 430M720 600L660 430"/>
  </g>

  <!-- 屏幕光 -->
  <ellipse cx="400" cy="260" rx="300" ry="180" fill="url(#screenGlow)" opacity=".55"/>

  <!-- 浅色显示器 -->
  <g transform="translate(0,24)">
    <ellipse cx="400" cy="438" rx="238" ry="22" fill="#24160E" opacity=".28" filter="url(#soft)"/>
    <rect x="190" y="110" width="420" height="290" rx="16" fill="#E8E2D4"/>
    <rect x="204" y="124" width="392" height="230" rx="4" fill="#1A2430"/>
    <g>
      <rect x="204" y="124" width="392" height="230" fill="#F2F0E9"/>
      <rect x="204" y="124" width="392" height="26" fill="#D9DEE3"/>
      <circle cx="218" cy="137" r="4" fill="#E05A46"/>
      <circle cx="232" cy="137" r="4" fill="#D9A94E"/>
      <circle cx="246" cy="137" r="4" fill="#7DDF8C"/>
      <rect x="220" y="162" width="214" height="178" rx="4" fill="#FFFFFF" stroke="#D9DEE3" stroke-width="2"/>
      <rect x="220" y="162" width="214" height="20" fill="#E8ECEF"/>
      <rect x="230" y="169" width="54" height="5" rx="2.5" fill="#6F8CA8"/>
      <g fill="#B9C4CC">
        <rect x="234" y="196" width="130" height="7" rx="3"/>
        <rect x="234" y="212" width="176" height="4" rx="2"/>
        <rect x="234" y="224" width="164" height="4" rx="2"/>
        <rect x="234" y="236" width="172" height="4" rx="2"/>
        <rect x="234" y="248" width="120" height="4" rx="2"/>
      </g>
      <rect x="234" y="268" width="86" height="54" rx="4" fill="#E8ECEF"/>
      <path d="M242 312l18-20 14 12 18-24 18 32z" fill="#6F8CA8" opacity=".55"/>
      <rect x="336" y="270" width="80" height="5" rx="2.5" fill="#C9D3DA"/>
      <rect x="336" y="282" width="64" height="4" rx="2" fill="#D9E0E5"/>
      <rect x="336" y="294" width="72" height="4" rx="2" fill="#D9E0E5"/>
      <rect x="448" y="162" width="132" height="178" rx="4" fill="#FFFFFF" stroke="#D9DEE3" stroke-width="2"/>
      <rect x="448" y="162" width="132" height="20" fill="#E8ECEF"/>
      <g stroke="#D9E0E5" stroke-width="1.5">
        <path d="M448 202h132M448 220h132M448 238h132M448 256h132M448 274h132M448 292h132M448 310h132"/>
        <path d="M470 182v158M500 182v158M530 182v158M560 182v158"/>
      </g>
      <rect x="500" y="220" width="30" height="18" fill="#E8B84E" opacity=".55"/>
      <rect x="530" y="256" width="30" height="18" fill="#7DDF8C" opacity=".45"/>
      <rect x="204" y="340" width="392" height="14" fill="#E8ECEF"/>
      <g fill="#8FA0AA">
        <rect x="220" y="344" width="34" height="6" rx="3"/>
        <rect x="260" y="344" width="24" height="6" rx="3"/>
        <rect x="290" y="344" width="42" height="6" rx="3"/>
      </g>
    </g>
    <!-- 显示器上的贴纸 -->
    <path d="M220 370l7 8-6 8-7-8z" fill="#E8C94E" opacity=".9"/>
    <circle cx="566" cy="374" r="6" fill="#E8A0A0" opacity=".9"/>
    <rect x="388" y="400" width="24" height="30" fill="#C9C4B8"/>
    <rect x="348" y="428" width="104" height="10" rx="5" fill="#C9C4B8"/>
  </g>

  <!-- 浅色键盘和鼠标 -->
  <g transform="translate(0,28)">
    <rect x="282" y="454" width="236" height="58" rx="8" fill="#E8E2D4"/>
    <g stroke="#C9C2B2" stroke-width="2" opacity=".9">
      <path d="M296 468h208M296 482h208M296 496h208M310 460v46M330 460v46M350 460v46M370 460v46M390 460v46M410 460v46M430 460v46M450 460v46M470 460v46M490 460v46"/>
    </g>
    <path d="M282 506h236" stroke="#B9B2A2" stroke-width="3" opacity=".7"/>
    <ellipse cx="564" cy="482" rx="19" ry="27" fill="#E8E2D4"/>
    <path d="M564 468v22" stroke="#B9B2A2" stroke-width="2"/>
    <path d="M554 472c6-4 14-4 20 0" fill="none" stroke="#C9C2B2" stroke-width="2" opacity=".7"/>
  </g>

  <!-- 咖啡、笔记本和笔 -->
  <g transform="translate(0,14)">
    <ellipse cx="150" cy="502" rx="58" ry="16" fill="#2B1A10" opacity=".4" filter="url(#soft)"/>
    <path d="M106 448h80l-7 46c-1 9-14 13-33 13s-32-4-33-13z" fill="#E8DFC8"/>
    <ellipse cx="146" cy="448" rx="40" ry="11" fill="#F7EBD8"/>
    <ellipse cx="146" cy="448" rx="32" ry="8" fill="#6F4A32"/>
    <path d="M184 460c20 0 21 30 0 30" fill="none" stroke="#C9A57F" stroke-width="7"/>
    <g fill="none" stroke="#D9CEB8" stroke-width="3" stroke-linecap="round" opacity=".55">
      <path d="M136 430c-8-12 8-18 1-30M156 430c-7-10 6-16 1-26"/>
    </g>
    <path d="M604 430L706 422L718 490L614 500Z" fill="#E8DFC8"/>
    <g stroke="#B9A68C" stroke-width="2" opacity=".8">
      <path d="M622 444l78-6M626 458l78-6M630 472l78-6M634 486l62-5"/>
    </g>
    <path d="M696 418l14 84" stroke="#A54835" stroke-width="5" stroke-linecap="round" transform="rotate(4 703 460)"/>
    <path d="M700 418l6 10" stroke="#D9CEB8" stroke-width="3"/>
    <rect x="244" y="446" width="30" height="30" rx="3" fill="#E8C94E" transform="rotate(-8 259 461)"/>
    <path d="M250 456h18M250 464h14" stroke="#8A7A4A" stroke-width="2" opacity=".7"/>
  </g>

  <rect width="800" height="600" filter="url(#grain)" opacity=".14" style="mix-blend-mode:soft-light"/>
  <rect width="800" height="600" fill="#3A2416" opacity=".05"/>
</svg>





