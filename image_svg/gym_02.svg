<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title desc">
  <title id="title">健身房的一角</title>
  <desc id="desc">傍晚的健身房里，地板上放着一对哑铃，旁边是一瓶一升水和一条毛巾。</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#242B2D"/>
      <stop offset="1" stop-color="#171D1F"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#303638"/>
      <stop offset="1" stop-color="#1B2022"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24344B"/>
      <stop offset=".55" stop-color="#5D6070"/>
      <stop offset="1" stop-color="#D6875C"/>
    </linearGradient>
    <radialGradient id="lamp" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFF1CF" stop-opacity=".9"/>
      <stop offset=".45" stop-color="#FFE3A8" stop-opacity=".35"/>
      <stop offset="1" stop-color="#FFE3A8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bench" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4B4B4C"/>
      <stop offset="1" stop-color="#252627"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E6E9E8"/>
      <stop offset=".4" stop-color="#8B9293"/>
      <stop offset=".68" stop-color="#D4D8D7"/>
      <stop offset="1" stop-color="#5F6667"/>
    </linearGradient>
    <linearGradient id="dumbbell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B6264"/>
      <stop offset="1" stop-color="#202426"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FD8E7" stop-opacity=".95"/>
      <stop offset="1" stop-color="#3AA0B9" stop-opacity=".95"/>
    </linearGradient>
    <linearGradient id="towel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#356B6B"/>
      <stop offset="1" stop-color="#204C50"/>
    </linearGradient>
    <linearGradient id="matGrey" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#596468"/>
      <stop offset="1" stop-color="#3D474B"/>
    </linearGradient>
    <pattern id="matDots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.4" fill="#A4B0B3" opacity=".18"/>
      <circle cx="12" cy="12" r="1.2" fill="#1B2225" opacity=".3"/>
    </pattern>
    <!-- 可复用哑铃：横杆+两端六角片，整体约 192x80 -->
    <g id="db">
      <rect x="42" y="28" width="116" height="17" rx="8.5" fill="url(#metal)"/>
      <path d="M30 2l30 17v44L30 80 0 63V19z" fill="url(#dumbbell)"/>
      <path d="M162 2l30 17v44l-30 17-30-17V19z" fill="url(#dumbbell)"/>
      <path d="M30 29l11 7v10l-11 7-11-7V36zM162 29l11 7v10l-11 7-11-7V36z" fill="#2E3435" opacity=".55"/>
      <path d="M14 16c10-6 22-6 32-1M146 16c10-6 22-6 32-1" fill="none" stroke="#8D9697" stroke-width="3" opacity=".45"/>
    </g>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".88" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".2"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#wall)"/>
  <rect y="414" width="800" height="186" fill="url(#floor)"/>

  <!-- 墙面结构 -->
  <g opacity=".55">
    <path d="M0 90h800M0 180h800M0 270h800M0 360h800" stroke="#111719" stroke-width="3"/>
    <path d="M80 0v414M200 0v414M320 0v414M440 0v414M560 0v414M680 0v414" stroke="#111719" stroke-width="2" opacity=".6"/>
  </g>
  <g stroke="#3C4446" stroke-width="2" opacity=".4">
    <path d="M0 92h800M0 182h800M0 272h800"/>
  </g>

  <!-- 窗 -->
  <g>
    <rect x="70" y="76" width="248" height="252" rx="8" fill="url(#window)"/>
    <path d="M70 265h248v63H70z" fill="#202936" opacity=".9"/>
    <g fill="#E7B379" opacity=".78">
      <rect x="92" y="250" width="18" height="35"/><rect x="118" y="238" width="24" height="47"/>
      <rect x="151" y="256" width="16" height="29"/><rect x="176" y="230" width="28" height="55"/>
      <rect x="214" y="246" width="20" height="39"/><rect x="246" y="222" width="30" height="63"/>
      <rect x="286" y="252" width="16" height="33"/>
    </g>
    <g fill="#7F8E9D" opacity=".25">
      <rect x="70" y="76" width="248" height="252"/>
    </g>
    <g stroke="#111719" stroke-width="6">
      <rect x="70" y="76" width="248" height="252" rx="8" fill="none"/>
      <path d="M194 76v252M70 200h248"/>
    </g>
  </g>

  <!-- 顶灯光 -->
  <g>
    <ellipse cx="553" cy="46" rx="150" ry="118" fill="url(#lamp)" opacity=".5"/>
    <rect x="478" y="20" width="150" height="14" rx="7" fill="#2C3234"/>
    <rect x="497" y="34" width="112" height="7" rx="3.5" fill="#F8E1B6" opacity=".9"/>
    <ellipse cx="553" cy="340" rx="190" ry="94" fill="url(#lamp)" opacity=".12"/>
  </g>

  <!-- 地板透视和橡胶纹理 -->
  <g stroke="#454B4D" stroke-width="2" opacity=".28">
    <path d="M0 468h800M0 520h800M0 570h800"/>
    <path d="M80 414l-80 186M230 414l-30 186M380 414l18 186M530 414l55 186M680 414l93 186M800 414l130 186"/>
  </g>

  <!-- 右上角墙上装饰-->
  <g>
    <!-- 墙上装饰画：日落山景 -->
    <g transform="translate(-7,0)">
      <rect x="572" y="118" width="158" height="104" rx="8" fill="#1E2527" stroke="#3A4143" stroke-width="6"/>
      <rect x="582" y="128" width="138" height="84" rx="4" fill="#263034"/>
      <circle cx="688" cy="158" r="15" fill="#E7B379" opacity=".85"/>
      <path d="M588 196 l28-26 18 16 25-20 24 30z" fill="#3A464A"/>
      <path d="M585 203 l40-18 30 12 34-14 10 0 16 19z" fill="#2E383B"/>
    </g>

    <!-- 墙上圆钟 -->
    <g>
      <circle cx="430" cy="180" r="34" fill="#1E2527" stroke="#3A4143" stroke-width="5"/>
      <circle cx="430" cy="180" r="26" fill="#263034"/>
      <path d="M430 180l-9-13M430 180l11 7" stroke="#E7B379" stroke-width="3" stroke-linecap="round"/>
      <circle cx="430" cy="180" r="3" fill="#E7B379"/>
    </g>
    <!-- 墙架：毛巾、粉块、小水壶 -->
    <g>
      <ellipse cx="642" cy="286" rx="102" ry="10" fill="#080B0C" opacity=".35" filter="url(#soft)"/>
      <g transform="translate(4,6)"> <!-- 毛巾 -->
        <rect x="565" y="244" width="55" height="10" rx="4" fill="#365E60"/>
        <rect x="570" y="235" width="45" height="9" rx="4" fill="#2D5054"/>
        <path d="M570 239c15 2 31 2 45 0" fill="none" stroke="#7FB0AA" stroke-width="2" opacity=".55"/>
      </g>
      <g>
        <rect x="642" y="239" width="27" height="21" rx="5" fill="#D6D1C2"/>
        <rect x="646" y="243" width="19" height="6" rx="2" fill="#9C9A8E" opacity=".65"/>
      </g>
      <g>
        <rect x="686" y="232" width="22" height="28" rx="6" fill="#285A61" opacity=".85"/>
        <rect x="691" y="236" width="12" height="7" rx="3" fill="#B7E0DA" opacity=".6"/>
      </g>
    </g>
      <path d="M560 271h20l-20 28zM700 271h20l-20 28z" fill="#303739"/>
      <rect x="548" y="260" width="190" height="12" rx="4" fill="#4A3930"/>
      <path d="M556 265c52-3 118-3 174 0" fill="none" stroke="#9A7A60" stroke-width="2" opacity=".55"/>
   </g>

  <!-- 墙边泡沫轴 -->
  <g transform="rotate(10 550 1000)">
    <rect x="338" y="362" width="28" height="116" rx="14" fill="#3B7072"/>
    <path d="M344 370v100" stroke="#7FB7B4" stroke-width="4" stroke-linecap="round" opacity=".45"/>
    <path d="M338 392h28M338 420h28M338 448h28" stroke="#8bcfd2" stroke-width="2" opacity=".6"/>
  </g>

  <!-- 后方的训练凳 -->
  <g>
     <g>
      <ellipse cx="598" cy="456" rx="145" ry="18" fill="#0C1011" opacity=".55" filter="url(#soft)"/>
      <path d="M520 386l-20 68M676 386l20 68" stroke="#6F7778" stroke-width="9" stroke-linecap="round"/>
      <path d="M498 455 h40 M658 455 h40" stroke="#7D8586" stroke-width="7" stroke-linecap="round"/>
      <path d="M484 372h226l12 20H476z" fill="#34383A"/>
      <rect x="490" y="350" width="218" height="24" rx="10" fill="url(#bench)"/>
      <path d="M495 363h208" stroke="#6A6F70" stroke-width="3" opacity=".45"/>
    </g>
    <g>
      <path d="M548 346c31-10 71-10 99 4l-5 34c-32-11-63-11-96-4z" fill="url(#towel)"/>
      <path d="M555 358 c32 8 66 9 85 2" fill="none" stroke="#4B8A88" stroke-width="3" opacity=".7"/>
    </g>
  </g>

  <g transform="translate(40, -3)">
    <!-- 灰色训练地垫 -->
    <g>
      <ellipse cx="244" cy="535" rx="185" ry="28" fill="#080B0C" opacity=".35" filter="url(#soft)"/>
      <path d="M118 494H368L408 574H78Z" fill="url(#matGrey)" stroke="#778286" stroke-width="4" stroke-linejoin="round"/>
      <path d="M130 502H356L388 564H96Z" fill="url(#matDots)" opacity=".85"/>
      <path d="M118 494H368L408 574H78Z" fill="none" stroke="#242B2E" stroke-width="2" opacity=".45"/>
    </g>

    <!-- 主哑铃：按真实比例缩小 -->
    <g>
      <use href="#db" transform="translate(120 460) scale(.78) rotate(-7)"/>
      <use href="#db" transform="translate(285 492) scale(.58) rotate(5)" opacity=".92"/>
    </g>

    <!-- 地垫上的弹力带 -->
    <g fill="none" stroke="#3A8A88" stroke-width="6" stroke-linecap="round" opacity=".72">
      <path d="M158 542c36-26 84-23 106 2 16 18-16 30-34 15-21-18-47-18-66 0-16 13-26 4-6-17z"/>
    </g>

    <!-- 1L 水壶：缩小并放到哑铃和训练凳之间 -->
    <g transform="translate(40 380)">
      <ellipse cx="24" cy="132" rx="31" ry="8" fill="#070A0A" opacity=".55" filter="url(#soft)"/>
      <path d="M3 32h42v92c0 12-9 18-21 18s-21-6-21-18z" fill="#D8EEF1" opacity=".28"/>
      <path d="M7 48h34v76c0 8-7 12-17 12s-17-4-17-12z" fill="url(#water)" opacity=".82"/>
      <rect x="3" y="18" width="42" height="25" rx="7" fill="#D9EFF0" opacity=".55"/>
      <rect x="12" y="2" width="24" height="18" rx="5" fill="#287789"/>
      <path d="M10 58h28M10 92h28M10 122h28" stroke="#EAFBFD" stroke-width="2.5" opacity=".65"/>
      <text x="24" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#EFFDFF" opacity=".9">1L</text>
      <path d="M8 54c10-4 22-4 32 0" fill="none" stroke="#E8FFFF" stroke-width="3" opacity=".55"/>
    </g>
  </g>

  <!-- 右前方壶铃 -->
  <g transform="translate(630 460)">
    <ellipse cx="0" cy="34" rx="36" ry="10" fill="#070A0A" opacity=".55" filter="url(#soft)"/>
    <path d="M-22 5c-2-27 44-27 44 0" fill="none" stroke="#8B9293" stroke-width="9" stroke-linecap="round"/>
    <circle cx="0" cy="22" r="28" fill="#2D3335"/>
    <path d="M-16 10c8-9 24-11 34-3" fill="none" stroke="#778183" stroke-width="4" opacity=".55"/>
    <circle cx="-9" cy="14" r="3" fill="#0E1213" opacity=".55"/>
  </g>

  <!-- 地面反光 -->
  <ellipse cx="620" cy="510" rx="76" ry="12" fill="#8ED9E5" opacity=".08" filter="url(#soft)"/>
  <rect width="800" height="600" filter="url(#grain)" opacity=".2" style="mix-blend-mode:soft-light"/>
  <rect width="800" height="600" fill="#0B1113" opacity=".1"/>
</svg>
