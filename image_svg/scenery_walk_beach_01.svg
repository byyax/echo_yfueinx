<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title desc">
  <title id="title">海边散步</title>
  <desc id="desc">白天的海边，木栈道从沙滩通向海面，右边是海和浪花，左边是沙丘和草，远处有一座小灯塔。</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9CCBE2"/>
      <stop offset=".65" stop-color="#CDE6F0"/>
      <stop offset="1" stop-color="#F2E6CC"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4E8FA8"/>
      <stop offset="1" stop-color="#2D647C"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8D3A8"/>
      <stop offset="1" stop-color="#C9A877"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A97852"/>
      <stop offset="1" stop-color="#745036"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".88" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".15"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="660" cy="88" r="34" fill="#FFF8D6" opacity=".8"/>
  <circle cx="660" cy="88" r="130" fill="#FFF3C8" opacity=".2" filter="url(#soft)"/>

  <!-- 云和海鸥 -->
  <g fill="#FFFFFF" opacity=".65">
    <ellipse cx="180" cy="108" rx="62" ry="17"/><ellipse cx="226" cy="98" rx="40" ry="13"/>
    <ellipse cx="440" cy="150" rx="54" ry="15"/><ellipse cx="480" cy="142" rx="34" ry="11"/>
  </g>
  <g fill="none" stroke="#5B6E78" stroke-width="2" opacity=".6">
    <path d="M520 118c6-5 12-5 18 0M560 100c5-4 10-4 15 0M600 124c5-4 10-4 15 0"/>
  </g>

  <!-- 海 -->
  <path d="M0 262H800V430H0Z" fill="url(#sea)"/>
  <path d="M0 262H800" stroke="#D9EEF4" stroke-width="4" opacity=".7"/>
  <g fill="none" stroke="#D9EEF4" stroke-width="2" opacity=".45">
    <path d="M0 290h800M0 322h800M0 354h800M0 386h800M0 418h800"/>
  </g>
  <g fill="#FFFFFF" opacity=".5">
    <path d="M120 420c14-8 28-8 42 0-14 4-28 4-42 0z"/>
    <path d="M420 428c18-10 36-10 54 0-18 5-36 5-54 0z"/>
    <path d="M650 414c12-7 24-7 36 0-12 4-24 4-36 0z"/>
  </g>

  <!-- 沙滩 -->
  <path d="M0 424C180 404 340 408 500 424c120 12 220 8 300-4v180H0Z" fill="url(#sand)"/>

  <!-- 远处灯塔 -->
  <g>
    <path d="M704 310h28l-5 74h-18z" fill="#E8DFC8"/>
    <path d="M700 310h36l-3 12h-30z" fill="#A54835"/>
    <rect x="710" y="290" width="16" height="20" fill="#D9CEB8"/>
    <path d="M710 290h16l-8-12z" fill="#A54835"/>
    <circle cx="718" cy="284" r="12" fill="#FFE4A2" opacity=".3"/>
  </g>

  <!-- 沙丘和草 -->
  <g>
    <path d="M0 440C60 390 130 382 200 410c44 18 78 46 94 78H0z" fill="#D9B97E"/>
    <path d="M0 472C60 430 130 430 200 460c30 14 54 34 68 58H0z" fill="#C9A56A" opacity=".8"/>
    <g stroke="#5E7F52" stroke-width="3" stroke-linecap="round">
      <path d="M42 434c-4-34 10-58 22-76M58 438c2-28 16-48 30-62M176 430c-2-24 8-42 20-56M194 446c4-22 14-36 26-46"/>
    </g>
    <g stroke="#7FA866" stroke-width="2" stroke-linecap="round" opacity=".8">
      <path d="M38 434c-8-22 0-42 12-58M174 430c-6-18 0-34 10-46"/>
    </g>
  </g>

  <!-- 木栈道 -->
  <path d="M286 600L366 408H434L514 600Z" fill="url(#wood)"/>
  <g stroke="#5E3F2B" stroke-width="2" opacity=".45">
    <path d="M300 562h200M312 524h176M324 486h152M336 448h128M348 420h104"/>
    <path d="M286 600L366 408M514 600L434 408"/>
  </g>
  <g fill="#4A3122">
    <rect x="286" y="600" width="10" height="0"/>
  </g>

  <!-- 栈道栏杆 -->
  <g>
    <path d="M282 492L362 402M420 402L500 492" stroke="#745036" stroke-width="7" stroke-linecap="round"/>
    <path d="M292 490V540M372 406V456M410 406V456M490 490V540" stroke="#5E3F2B" stroke-width="6" stroke-linecap="round"/>
  </g>


  <!-- 脚印和贝壳 -->
  <g fill="#B99463" opacity=".55">
    <ellipse cx="250" cy="540" rx="8" ry="3" transform="rotate(-18 250 540)"/>
    <ellipse cx="272" cy="556" rx="8" ry="3" transform="rotate(14 272 556)"/>
    <ellipse cx="236" cy="572" rx="8" ry="3" transform="rotate(-14 236 572)"/>
  </g>
  <g fill="#F3E3C8">
    <path d="M560 540c10-8 22-6 26 2-8 6-18 8-26-2z"/>
    <path d="M620 566c8-6 18-4 22 2-7 5-15 6-22-2z"/>
  </g>

  <rect width="800" height="600" filter="url(#grain)" opacity=".14" style="mix-blend-mode:soft-light"/>
  <rect width="800" height="600" fill="#2C4A56" opacity=".04"/>
</svg>

