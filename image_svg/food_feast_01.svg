<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title desc">
  <title id="title">一桌丰盛的火锅</title>
  <desc id="desc">暖色灯光下，圆桌中间是鸳鸯火锅，周围摆满肉片、蔬菜、蘑菇、饺子和蘸料。</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#8B4C33"/>
      <stop offset=".58" stop-color="#573022"/>
      <stop offset="1" stop-color="#2A1712"/>
    </radialGradient>
    <radialGradient id="light" cx="50%" cy="46%" r="50%">
      <stop offset="0" stop-color="#FFE0A5" stop-opacity=".55"/>
      <stop offset=".55" stop-color="#FFC77A" stop-opacity=".18"/>
      <stop offset="1" stop-color="#FFC77A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="table" cx="45%" cy="42%" r="70%">
      <stop offset="0" stop-color="#9B5A3E"/>
      <stop offset="1" stop-color="#693A26"/>
    </radialGradient>
    <radialGradient id="pot" cx="42%" cy="37%" r="68%">
      <stop offset="0" stop-color="#F7F3E9"/>
      <stop offset=".8" stop-color="#D6D0C3"/>
      <stop offset="1" stop-color="#AAA292"/>
    </radialGradient>
    <radialGradient id="redBroth" cx="40%" cy="36%" r="70%">
      <stop offset="0" stop-color="#C84A31"/>
      <stop offset=".65" stop-color="#982C21"/>
      <stop offset="1" stop-color="#631B16"/>
    </radialGradient>
    <radialGradient id="clearBroth" cx="40%" cy="36%" r="70%">
      <stop offset="0" stop-color="#F5E5B9"/>
      <stop offset=".65" stop-color="#DDC58D"/>
      <stop offset="1" stop-color="#B69A64"/>
    </radialGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F0E6"/>
      <stop offset="1" stop-color="#CFC5B3"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="steam" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".18"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#light)"/>

  <!-- 大圆桌 -->
  <circle cx="400" cy="310" r="292" fill="#3A1E16" opacity=".7" filter="url(#soft)"/>
  <circle cx="400" cy="306" r="286" fill="#7E452D"/>
  <circle cx="400" cy="302" r="278" fill="url(#table)"/>
  <circle cx="400" cy="302" r="278" fill="none" stroke="#B87850" stroke-width="3" opacity=".55"/>
  <circle cx="400" cy="302" r="238" fill="#5E3222" opacity=".38"/>
  <g fill="none" stroke="#B0754F" stroke-width="2" opacity=".25">
    <path d="M155 212c120-83 350-82 488 0M129 330c136-75 403-78 543 0M171 444c113 53 331 53 455 0"/>
  </g>

  <!-- 桌面小碟 -->
  <g>
    <ellipse cx="178" cy="172" rx="72" ry="43" fill="#3A1D15" opacity=".45" filter="url(#soft)"/>
    <ellipse cx="174" cy="166" rx="69" ry="40" fill="url(#plate)"/>
    <ellipse cx="174" cy="164" rx="55" ry="30" fill="#F8F4EB"/>
    <g fill="#D67661">
      <ellipse cx="151" cy="157" rx="24" ry="10" transform="rotate(-12 151 157)"/>
      <ellipse cx="180" cy="167" rx="26" ry="11" transform="rotate(11 180 167)"/>
      <ellipse cx="197" cy="152" rx="20" ry="8" transform="rotate(-18 197 152)"/>
    </g>
    <path d="M147 152c11-6 24-7 36-3" fill="none" stroke="#F4B3A5" stroke-width="3" opacity=".7"/>
  </g>

  <g>
    <ellipse cx="650" cy="190" rx="68" ry="42" fill="#3A1D15" opacity=".45" filter="url(#soft)"/>
    <ellipse cx="647" cy="184" rx="65" ry="39" fill="url(#plate)"/>
    <ellipse cx="647" cy="182" rx="51" ry="29" fill="#F8F4EB"/>
    <g fill="#5E8B50">
      <path d="M617 180c-9-22 18-31 27-15 9-19 32-9 23 10-13 12-35 12-50 5z"/>
      <path d="M646 192c-5-17 16-24 22-8 6-13 24-7 17 7-8 10-26 9-39 1z" fill="#6F9D5A"/>
    </g>
    <g fill="#E9E0D2" opacity=".9">
      <circle cx="633" cy="174" r="7"/><circle cx="655" cy="188" r="6"/><circle cx="670" cy="174" r="5"/>
    </g>
  </g>

  <g>
    <ellipse cx="166" cy="448" rx="76" ry="44" fill="#3A1D15" opacity=".45" filter="url(#soft)"/>
    <ellipse cx="163" cy="441" rx="72" ry="41" fill="url(#plate)"/>
    <ellipse cx="163" cy="439" rx="57" ry="30" fill="#F8F4EB"/>
    <g fill="#C98D57">
      <ellipse cx="137" cy="434" rx="20" ry="12" transform="rotate(-20 137 434)"/>
      <ellipse cx="158" cy="446" rx="22" ry="13" transform="rotate(8 158 446)"/>
      <ellipse cx="184" cy="431" rx="19" ry="11" transform="rotate(-8 184 431)"/>
      <ellipse cx="164" cy="424" rx="17" ry="9" transform="rotate(22 164 424)"/>
    </g>
    <g fill="#E9C18E" opacity=".9">
      <circle cx="141" cy="431" r="4"/><circle cx="163" cy="443" r="4"/><circle cx="184" cy="430" r="3"/>
    </g>
  </g>

  <g>
    <ellipse cx="650" cy="458" rx="72" ry="44" fill="#3A1D15" opacity=".45" filter="url(#soft)"/>
    <ellipse cx="647" cy="451" rx="68" ry="41" fill="url(#plate)"/>
    <ellipse cx="647" cy="449" rx="53" ry="30" fill="#F8F4EB"/>
    <g fill="#F0D59A">
      <path d="M618 447c8-18 30-22 42-7 12-13 31-3 27 13-5 19-28 24-44 17-15-6-27-11-25-23z"/>
      <path d="M629 438c5-11 19-13 25-3" fill="none" stroke="#FFF4D5" stroke-width="3" opacity=".7"/>
    </g>
  </g>

  <!-- 火锅阴影 -->
  <ellipse cx="407" cy="349" rx="180" ry="112" fill="#2A120D" opacity=".55" filter="url(#soft)"/>

  <!-- 鸳鸯锅 -->
  <g>
    <ellipse cx="401" cy="310" rx="175" ry="121" fill="#9C9588"/>
    <ellipse cx="401" cy="302" rx="175" ry="120" fill="url(#pot)"/>
    <ellipse cx="401" cy="296" rx="153" ry="104" fill="#B7B0A3"/>
    <path d="M248 296c0-57 69-104 153-104s153 47 153 104v7c0 55-69 101-153 101s-153-46-153-101z" fill="#8D877C"/>
    <path d="M252 296c0-54 67-98 149-98 84 0 149 44 149 98 0 55-65 98-149 98-82 0-149-43-149-98z" fill="#6C655B"/>

    <!-- 汤汁 -->
    <path d="M261 296c0-49 62-89 140-89 43 0 82 12 108 31v67c-26 37-78 61-137 61-82 0-111-38-111-70z" fill="url(#redBroth)"/>
    <path d="M509 238c24 16 39 36 39 58 0 54-63 98-147 98-39 0-75-10-102-27v-67c26 23 64 37 106 37 49 0 91-17 104-37z" fill="url(#clearBroth)"/>
    <path d="M401 208c-32 0-61 6-85 17 4 45 39 79 85 79s81-34 85-79c-24-11-53-17-85-17z" fill="#B5803F" opacity=".5"/>
    <path d="M401 207v169" stroke="#F0E8D7" stroke-width="7" opacity=".9"/>
    <path d="M401 207v169" stroke="#9D8C70" stroke-width="2" opacity=".5"/>

    <!-- 红汤配料 -->
    <g fill="#B93A2A" opacity=".85">
      <circle cx="320" cy="267" r="7"/><circle cx="344" cy="310" r="5"/><circle cx="366" cy="252" r="6"/><circle cx="300" cy="323" r="5"/><circle cx="335" cy="350" r="6"/>
    </g>
    <g fill="#E85C42" opacity=".9">
      <path d="M286 282c10-12 26-8 29 4 3 14-14 23-26 16-9-5-10-12-3-20z"/>
      <path d="M328 292c8-10 21-7 24 3 2 11-11 18-21 13-8-4-9-9-3-16z"/>
    </g>
    <g fill="#F2D7A1" opacity=".8">
      <circle cx="378" cy="281" r="4"/><circle cx="309" cy="300" r="4"/><circle cx="357" cy="339" r="4"/>
    </g>

    <!-- 清汤配料 -->
    <g fill="#F3E6C6" opacity=".85">
      <circle cx="452" cy="272" r="8"/><circle cx="490" cy="290" r="6"/><circle cx="466" cy="325" r="7"/><circle cx="515" cy="315" r="5"/>
    </g>
    <g fill="#7A9E62" opacity=".8">
      <path d="M436 250c-4-14 15-19 20-7 5-10 20-4 14 8-8 8-24 7-34-1z"/>
      <path d="M497 342c-3-12 12-17 17-6 4-9 17-4 12 7-7 7-20 6-29-1z"/>
    </g>

    <!-- 锅沿高光 -->
    <path d="M286 239c32-34 74-50 115-50 55 0 104 26 132 63" fill="none" stroke="#FFFFFF" stroke-width="5" opacity=".33"/>
  </g>

  <!-- 锅耳 -->
  <g fill="#6B645A">
    <path d="M217 283h29c13 0 19 10 19 23s-8 22-19 22h-29z"/>
    <path d="M585 283h-29c-13 0-19 10-19 23s8 22 19 22h29z"/>
    <path d="M221 293h22c5 0 8 5 8 13s-3 13-8 13h-22z" fill="#9B9488"/>
    <path d="M579 293h-22c-5 0-8 5-8 13s3 13 8 13h22z" fill="#9B9488"/>
  </g>

  <!-- 蒸汽 -->
  <g fill="none" stroke="#FFE7C7" stroke-linecap="round" opacity=".3" filter="url(#steam)">
    <path d="M326 196c-23-36 20-56-4-95" stroke-width="12"/>
    <path d="M401 177c-18-40 20-57-4-103" stroke-width="11"/>
    <path d="M477 190c-21-34 16-53-3-89" stroke-width="12"/>
  </g>

  <!-- 蘸料碟 -->
  <g>
    <ellipse cx="277" cy="480" rx="46" ry="28" fill="#3A1D15" opacity=".45" filter="url(#soft)"/>
    <ellipse cx="275" cy="474" rx="43" ry="26" fill="#F2EDE2"/>
    <ellipse cx="275" cy="472" rx="31" ry="17" fill="#8D4F2D"/>
    <path d="M258 468c10-6 24-6 33 0" fill="none" stroke="#C57C51" stroke-width="3" opacity=".65"/>
  </g>
  <g>
    <ellipse cx="534" cy="486" rx="44" ry="27" fill="#3A1D15" opacity=".45" filter="url(#soft)"/>
    <ellipse cx="532" cy="480" rx="41" ry="25" fill="#F2EDE2"/>
    <ellipse cx="532" cy="478" rx="29" ry="16" fill="#D6A05C"/>
    <path d="M513 477c11-6 24-6 35 0" fill="none" stroke="#F1C788" stroke-width="3" opacity=".7"/>
  </g>

  <!-- 饮料：半俯视的玻璃杯，椭圆杯口+短杯壁 -->
  <g>
    <ellipse cx="716" cy="332" rx="39" ry="14" fill="#2F160F" opacity=".4" filter="url(#soft)"/>
    <path d="M686 296h60l-5 26c-2 11-12 17-25 17s-23-6-25-17z" fill="#E9D8B8" opacity=".22"/>
    <ellipse cx="716" cy="296" rx="30" ry="12" fill="#E9D8B8" opacity=".35"/>
    <ellipse cx="716" cy="297" rx="25" ry="9.5" fill="#D39A4F" opacity=".78"/>
    <path d="M724 296l7-52" stroke="#F0C36A" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- 筷子和勺子 -->
  <g stroke-linecap="round">
    <path d="M592 500l152-95" stroke="#C49A6C" stroke-width="8"/>
    <path d="M606 516l152-95" stroke="#B98559" stroke-width="7"/>
    <path d="M592 500l152-95" stroke="#D4AC7D" stroke-width="2.5" opacity=".6"/>
    <path d="M606 516l152-95" stroke="#D4AC7D" stroke-width="2.5" opacity=".5"/>
    <path d="M131 521c40-16 83-10 102 10" fill="none" stroke="#D5D0C5" stroke-width="8"/>
    <ellipse cx="127" cy="525" rx="19" ry="12" fill="#DED9CF" transform="rotate(-28 127 525)"/>
  </g>

  <rect width="800" height="600" fill="url(#light)" opacity=".25"/>
  <rect width="800" height="600" filter="url(#grain)" opacity=".17" style="mix-blend-mode:soft-light"/>
  <rect width="800" height="600" fill="#150A07" opacity=".1"/>
</svg>
