<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title desc">
  <title id="title">桌上的两份外卖</title>
  <desc id="desc">木桌俯视图，两份打开的外卖盒并排，一份是米饭和菜，一份是面，旁边有两双筷子和两杯饮料。</desc>
  <defs>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C39361"/>
      <stop offset="1" stop-color="#96673F"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3E9D4"/>
      <stop offset="1" stop-color="#DCCCB0"/>
    </linearGradient>
    <linearGradient id="box2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9DDC6"/>
      <stop offset="1" stop-color="#CBB99A"/>
    </linearGradient>
    <linearGradient id="tea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D9A565"/>
      <stop offset="1" stop-color="#B7793F"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".12"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#table)"/>
  <g stroke="#774C2C" stroke-width="3" opacity=".2">
    <path d="M0 108h800M0 244h800M0 380h800M0 516h800"/>
    <path d="M108 0v600M394 0v600M656 0v600"/>
  </g>
  <ellipse cx="400" cy="316" rx="330" ry="238" fill="#5A3820" opacity=".14" filter="url(#soft)"/>

  <!-- 外卖盒 1：米饭和菜 -->
  <g transform="translate(282 300)">
    <rect x="-166" y="-126" width="332" height="252" rx="20" fill="#5B3A22" opacity=".22" filter="url(#soft)"/>
    <rect x="-160" y="-132" width="320" height="252" rx="12" fill="url(#box)"/>
    <rect x="-146" y="-118" width="292" height="224" rx="8" fill="#FBF7EC"/>
    <rect x="-146" y="-118" width="292" height="224" rx="8" fill="none" stroke="#D8C5A4" stroke-width="3"/>
    <ellipse cx="-54" cy="-6" rx="70" ry="78" fill="#F1E7D2"/>
    <g fill="#EFE6CF">
      <ellipse cx="-55" cy="-8" rx="64" ry="70"/>
    </g>
    <g fill="#D8CBAF" opacity=".8">
      <ellipse cx="-74" cy="-30" rx="30" ry="17"/>
      <ellipse cx="-34" cy="-4" rx="36" ry="18"/>
      <ellipse cx="-62" cy="26" rx="31" ry="15"/>
    </g>
    <g>
      <ellipse cx="54" cy="-42" rx="54" ry="27" fill="#C9823E"/>
      <ellipse cx="54" cy="-42" rx="42" ry="18" fill="#E0A656"/>
      <ellipse cx="48" cy="22" rx="52" ry="25" fill="#6E8E4D"/>
      <ellipse cx="48" cy="22" rx="40" ry="17" fill="#8DAA63"/>
      <ellipse cx="64" cy="70" rx="48" ry="20" fill="#B85C4E"/>
      <ellipse cx="64" cy="70" rx="36" ry="13" fill="#D27A67"/>
      <g fill="#F5E6C3" opacity=".8">
        <circle cx="36" cy="-44" r="4"/><circle cx="62" cy="-34" r="3"/><circle cx="78" cy="-50" r="3"/>
      </g>
    </g>
    <g fill="#7C5A3A" opacity=".55">
      <ellipse cx="124" cy="-92" rx="8" ry="4"/><ellipse cx="-126" cy="80" rx="7" ry="4"/>
    </g>
    <path d="M-142 -116h284" stroke="#FFFFFF" stroke-width="4" opacity=".5"/>
  </g>

  <!-- 外卖盒 2：面 -->
  <g transform="translate(552 300) rotate(2)">
    <rect x="-130" y="-126" width="260" height="252" rx="20" fill="#5B3A22" opacity=".2" filter="url(#soft)"/>
    <rect x="-124" y="-132" width="248" height="252" rx="12" fill="url(#box2)"/>
    <rect x="-110" y="-118" width="220" height="224" rx="8" fill="#F7F0E0"/>
    <rect x="-110" y="-118" width="220" height="224" rx="8" fill="none" stroke="#C9B58F" stroke-width="3"/>
    <ellipse cx="0" cy="0" rx="94" ry="96" fill="#E9D7B5"/>
    <g fill="#D8B77A">
      <path d="M-72-30c32-28 82-26 110 0M-78-2c34-29 86-27 116 0M-72 26c33-28 84-26 112 0M-64 54c31-26 78-24 104 0" fill="none" stroke="#D2AD6D" stroke-width="9" stroke-linecap="round"/>
      <path d="M-58-42c28-25 72-23 98 0M-63-14c31-27 76-24 104 0M-58 14c30-26 78-23 102 0M-50 42c28-24 70-22 94 0" fill="none" stroke="#E6C98F" stroke-width="5" stroke-linecap="round"/>
    </g>
    <g>
      <ellipse cx="-34" cy="-50" rx="23" ry="16" fill="#F4E7C8"/>
      <ellipse cx="-34" cy="-50" rx="11" ry="8" fill="#D7A549"/>
      <ellipse cx="42" cy="34" rx="22" ry="15" fill="#F4E7C8"/>
      <ellipse cx="42" cy="34" rx="10" ry="7" fill="#D7A549"/>
      <path d="M-4-76c14-6 24-2 34 8M8 76c12-4 22 0 30 8" fill="none" stroke="#5F8B4D" stroke-width="7" stroke-linecap="round"/>
    </g>
    <g fill="#7E5A38" opacity=".6">
      <circle cx="-84" cy="-90" r="4"/><circle cx="82" cy="82" r="4"/><circle cx="94" cy="-72" r="3"/>
    </g>
  </g>

  <!-- 筷子 -->
  <g transform="translate(448 506) rotate(-6)">
    <path d="M-96 0h192" stroke="#A97643" stroke-width="7" stroke-linecap="round"/>
    <path d="M-96 14h192" stroke="#C49158" stroke-width="7" stroke-linecap="round"/>
    <path d="M-96 0h192" stroke="#E7C08A" stroke-width="2" opacity=".55"/>
  </g>
  <g transform="translate(392 86) rotate(9)">
    <path d="M-80 0h160" stroke="#9D6C3C" stroke-width="6" stroke-linecap="round"/>
    <path d="M-80 12h160" stroke="#B98550" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- 两杯饮料 -->
  <g transform="translate(118 150)">
    <ellipse cx="0" cy="92" rx="52" ry="13" fill="#4F2F1B" opacity=".3" filter="url(#soft)"/>
    <path d="M-42-40h84l-8 122q-2 10-12 10h-44q-10 0-12-10z" fill="#DCE7DF" opacity=".85"/>
    <path d="M-34-12h68l-6 86q-1 7-8 7h-40q-7 0-8-7z" fill="url(#tea)"/>
    <ellipse cx="0" cy="-40" rx="42" ry="12" fill="#EEF4EC"/>
    <ellipse cx="0" cy="-40" rx="34" ry="8" fill="#C9A06C"/>
    <path d="M14-46l10-68" stroke="#E8E1D5" stroke-width="7" stroke-linecap="round"/>
  </g>
  <g transform="translate(686 168)">
    <ellipse cx="0" cy="86" rx="48" ry="12" fill="#4F2F1B" opacity=".3" filter="url(#soft)"/>
    <path d="M-38-34h76l-7 112q-2 9-11 9h-40q-9 0-11-9z" fill="#E6DDCC" opacity=".9"/>
    <path d="M-30-8h60l-5 78q-1 6-7 6h-36q-6 0-7-6z" fill="#C98E5C"/>
    <ellipse cx="0" cy="-34" rx="38" ry="11" fill="#F2EBDF"/>
    <ellipse cx="0" cy="-34" rx="30" ry="7" fill="#8E5F3C"/>
    <path d="M12-40l7-58" stroke="#DCD4C6" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- 纸巾 -->
  <g transform="translate(694 476) rotate(9)">
    <rect x="-56" y="-40" width="112" height="80" rx="6" fill="#F2E9D8"/>
    <path d="M-56 0h112" stroke="#D7C8B1" stroke-width="2"/>
    <path d="M-40-40l-10 80" stroke="#D7C8B1" stroke-width="2" opacity=".4"/>
  </g>

  <rect width="800" height="600" filter="url(#grain)" opacity=".11" style="mix-blend-mode:soft-light"/>
</svg>
