<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title desc">
  <title id="title">阳台上晾着的衣服</title>
  <desc id="desc">阳台晾衣架上挂着一件深蓝色上衣、一件浅色小上衣和一条毛巾，午后阳光照进来。</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A9D2E4"/>
      <stop offset=".7" stop-color="#D8E9E7"/>
      <stop offset="1" stop-color="#F4EEDC"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D8C4A8"/>
      <stop offset="1" stop-color="#B29370"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3D5C78"/>
      <stop offset=".55" stop-color="#527491"/>
      <stop offset="1" stop-color="#2F4962"/>
    </linearGradient>
    <linearGradient id="small" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8D5C5"/>
      <stop offset="1" stop-color="#CFAE9D"/>
    </linearGradient>
    <linearGradient id="towel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9E0CF"/>
      <stop offset="1" stop-color="#C8B89F"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".13"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <g fill="#FFFFFF" opacity=".6">
    <ellipse cx="186" cy="116" rx="96" ry="27"/>
    <ellipse cx="264" cy="104" rx="56" ry="20"/>
    <ellipse cx="630" cy="150" rx="78" ry="22"/>
  </g>
  <rect y="392" width="800" height="208" fill="url(#floor)"/>
  <path d="M0 392h800v10H0z" fill="#EFE0C9" opacity=".65"/>
  <g stroke="#8F6A49" stroke-width="2" opacity=".22">
    <path d="M0 446h800M0 518h800M0 570h800"/>
  </g>

  <!-- 阳台栏杆 -->
  <g>
    <path d="M0 332h800v14H0z" fill="#8D9898"/>
    <path d="M0 360h800v8H0z" fill="#AAB3B1" opacity=".8"/>
    <g stroke="#7F8B8B" stroke-width="7">
      <path d="M72 346v70M188 346v70M304 346v70M420 346v70M536 346v70M652 346v70M768 346v70"/>
    </g>
  </g>

  <!-- 晾衣架 -->
  <g>
    <ellipse cx="400" cy="542" rx="282" ry="34" fill="#543B29" opacity=".2" filter="url(#soft)"/>
    <path d="M138 174h524" stroke="#AEB7B4" stroke-width="9" stroke-linecap="round"/>
    <path d="M138 174h524" stroke="#E7ECEA" stroke-width="3" stroke-linecap="round" opacity=".65"/>
    <path d="M160 174l-22 344M640 174l22 344" stroke="#8D9898" stroke-width="9" stroke-linecap="round"/>
    <path d="M138 518h524" stroke="#8D9898" stroke-width="8" stroke-linecap="round"/>
    <path d="M132 510l-22 34M668 510l22 34" stroke="#8D9898" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- 深蓝上衣 -->
  <g>
    <path d="M270 194c14-12 38-18 58-18h74c20 0 44 6 58 18l38 48-30 22-20-24v170c-28 8-56 11-84 11s-56-3-84-11V240l-20 24-30-22z" fill="url(#shirt)"/>
    <path d="M328 190c8 14 20 22 37 22s29-8 37-22" fill="none" stroke="#263B4F" stroke-width="5"/>
    <path d="M300 248v136M470 248v136" stroke="#2A4157" stroke-width="4" opacity=".45"/>
    <path d="M350 320q50 20 100 0" fill="none" stroke="#2C445A" stroke-width="4" opacity=".35"/>
    <g stroke="#AFC4D3" stroke-width="3" opacity=".28">
      <path d="M280 330q28 10 52 5M470 356q-26 12-54 7"/>
    </g>
    <!-- 衣架 -->
    <path d="M362 182l38-30 38 30" fill="none" stroke="#C7B49A" stroke-width="8" stroke-linecap="round"/>
    <path d="M400 152v-18c0-12 13-16 20-7" fill="none" stroke="#C7B49A" stroke-width="7" stroke-linecap="round"/>
    <path d="M360 188h80" stroke="#B09A7F" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- 浅色小上衣 -->
  <g>
    <path d="M520 230c10-9 26-13 40-13h46c14 0 30 4 40 13l26 34-21 15-13-17v110c-18 6-36 8-54 8s-36-2-54-8V262l-13 17-21-15z" fill="url(#small)"/>
    <path d="M560 226c6 10 14 15 25 15s19-5 25-15" fill="none" stroke="#B78E7B" stroke-width="4"/>
    <path d="M542 276v92M622 276v92" stroke="#BC9786" stroke-width="3" opacity=".42"/>
    <path d="M566 336q26 10 52 0" fill="none" stroke="#BC9786" stroke-width="3" opacity=".35"/>
    <path d="M573 220l39-26 39 26" fill="none" stroke="#D0BEA8" stroke-width="7" stroke-linecap="round"/>
    <path d="M573 226h78" stroke="#B09A7F" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- 毛巾 -->
  <g>
    <path d="M170 224h78l12 164q-50 16-100 0z" fill="url(#towel)"/>
    <path d="M170 224h78l3 36h-84z" fill="#D6C8B2" opacity=".6"/>
    <path d="M176 270h66M178 304h64M180 338h62" stroke="#B4A186" stroke-width="3" opacity=".5"/>
    <path d="M203 212v-28" stroke="#C7B49A" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- 夹子 -->
  <g fill="#D7C9B2">
    <rect x="256" y="174" width="24" height="44" rx="6"/>
    <rect x="390" y="174" width="24" height="44" rx="6"/>
    <rect x="514" y="174" width="24" height="44" rx="6"/>
    <rect x="638" y="174" width="24" height="44" rx="6"/>
  </g>

  <!-- 阳光和影子 -->
  <g fill="#FFE5B2" opacity=".2" filter="url(#soft)">
    <ellipse cx="245" cy="280" rx="100" ry="22" transform="rotate(-28 245 280)"/>
    <ellipse cx="600" cy="350" rx="74" ry="18" transform="rotate(-20 600 350)"/>
  </g>
  <path d="M0 540h800v60H0z" fill="#7B5130" opacity=".06"/>
  <rect width="800" height="600" filter="url(#grain)" opacity=".11" style="mix-blend-mode:soft-light"/>
</svg>
