<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title desc">
  <title id="title">一盒家常盒饭</title>
  <desc id="desc">深夜厨房的台面上铺着深蓝格纹桌旗，半俯视的分格便当盒，内壁有厚度，米饭、炸鸡、玉子烧、西兰花和小番茄摆得满满当当，旁边一双筷子。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A3E3F"/>
      <stop offset="1" stop-color="#202426"/>
    </linearGradient>
    <radialGradient id="lamp" cx="50%" cy="42%" r="55%">
      <stop offset="0" stop-color="#FFE0A7" stop-opacity=".6"/>
      <stop offset=".55" stop-color="#FFC978" stop-opacity=".14"/>
      <stop offset="1" stop-color="#FFC978" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7A5B42"/>
      <stop offset="1" stop-color="#4A3527"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4E5E66"/>
      <stop offset="1" stop-color="#33404A"/>
    </linearGradient>
    <radialGradient id="rice" cx="45%" cy="35%" r="75%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".85" stop-color="#F2ECDD"/>
      <stop offset="1" stop-color="#DCD0B8"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".18"/></feComponentTransfer>
    </filter>
    <linearGradient id="wallBeige" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4E7D1"/>
      <stop offset="1" stop-color="#E2CDAF"/>
    </linearGradient>
    <linearGradient id="cityDusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FA6B0"/>
      <stop offset=".62" stop-color="#C59A76"/>
      <stop offset="1" stop-color="#E0AA72"/>
    </linearGradient>
    <linearGradient id="clothGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6F8060"/>
      <stop offset="1" stop-color="#53664A"/>
    </linearGradient>
    <linearGradient id="floorWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8A6246"/>
      <stop offset="1" stop-color="#6A4832"/>
    </linearGradient>
    <linearGradient id="lightCone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF4D6" stop-opacity=".26"/>
      <stop offset=".65" stop-color="#FFE7B0" stop-opacity=".16"/>
      <stop offset="1" stop-color="#FFE7B0" stop-opacity=".03"/>
    </linearGradient>
    <radialGradient id="lightPool" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFF1C8" stop-opacity=".55"/>
      <stop offset=".55" stop-color="#FFDD9A" stop-opacity=".24"/>
      <stop offset="1" stop-color="#FFDD9A" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tableClip">
      <path d="M80 285H720L900 548H-100Z"/>
    </clipPath>
    <clipPath id="sideWindowClip">
      <path d="M30 82L148 106V206L30 230Z"/>
    </clipPath>
  </defs>

  <!-- 沿用 food_simple_01 的厨房背景 -->
  <rect width="800" height="600" fill="url(#bg)"/>
  <g opacity=".72">
    <rect x="0" y="0" width="800" height="88" fill="#202527"/>
    <path d="M0 88h800" stroke="#51595A" stroke-width="3" opacity=".6"/>
    <rect x="54" y="106" width="245" height="190" rx="8" fill="#181D1F"/>
    <rect x="64" y="116" width="225" height="170" rx="4" fill="#23333A"/>
    <path d="M64 208h225M174 116v170" stroke="#39474C" stroke-width="3" opacity=".7"/>
    <g fill="#F0C778" opacity=".2">
      <rect x="76" y="130" width="18" height="18"/><rect x="110" y="160" width="28" height="10"/><rect x="190" y="140" width="19" height="24"/>
    </g>
    <rect x="536" y="112" width="214" height="172" rx="8" fill="#242A2B"/>
    <path d="M552 128h182M552 164h182M552 200h182M552 236h182" stroke="#393F40" stroke-width="3" opacity=".48"/>
    <circle cx="684" cy="226" r="8" fill="#7D8989" opacity=".4"/>
    <path d="M586 210h86" stroke="#515A5A" stroke-width="4" opacity=".6"/>
  </g>

  <ellipse cx="386" cy="226" rx="360" ry="250" fill="url(#lamp)" opacity=".8"/>
  <path d="M0 300h800v300H0z" fill="#6E4A32"/>
  <path d="M0 300h800" stroke="#A87A56" stroke-width="4" opacity=".7"/>
  <g stroke="#4A3021" stroke-width="2" opacity=".35">
    <path d="M0 365h800M0 438h800M0 511h800M0 570h800"/>
    <path d="M138 300v300M326 300v300M514 300v300M702 300v300"/>
  </g>

  <!-- 深蓝格纹桌旗 -->
  <path d="M258 300Q400 294 542 300L612 554H188Z" fill="#24364A"/>
  <g stroke="#D9CEB8" stroke-width="7" opacity=".55">
    <path d="M300 300L254 554"/>
    <path d="M350 298L336 554"/>
    <path d="M400 297L418 554"/>
    <path d="M450 298L500 554"/>
    <path d="M500 300L582 554"/>
  </g>
  <g stroke="#D9CEB8" stroke-width="7" opacity=".45">
    <path d="M240 344Q400 336 560 344"/>
    <path d="M228 400Q400 390 572 400"/>
    <path d="M214 458Q400 446 586 458"/>
    <path d="M198 518Q400 504 602 518"/>
  </g>
  <g stroke="#A54835" stroke-width="2" opacity=".7">
    <path d="M280 300L220 554M320 299L294 554M370 297L370 554M420 297L456 554M470 299L530 554M520 300L600 554"/>
    <path d="M232 370Q400 360 568 370M218 428Q400 416 582 428M204 488Q400 474 596 488"/>
  </g>
  <g stroke="#D9CEB8" stroke-width="2" opacity=".8">
    <path d="M260 554v8M280 554v8M300 554v8M320 554v8M340 554v8M360 554v8M380 554v8M400 554v8M420 554v8M440 554v8M460 554v8M480 554v8M500 554v8M520 554v8M540 554v8M560 554v8M580 554v8"/>
  </g>
  <ellipse cx="400" cy="468" rx="300" ry="135" fill="url(#lightPool)" opacity=".55"/>
  <!-- 便当盒阴影 -->
  <ellipse cx="405" cy="486" rx="230" ry="48" fill="#120D0A" opacity=".55" filter="url(#soft)"/>

  <!-- 便当盒：外框立体，内壁也有厚度 -->
  <g>
    <path d="M250 292H550L594 472H206Z" fill="url(#box)" stroke="#243039" stroke-width="4" stroke-linejoin="round"/>
    <path d="M250 292H550" stroke="#81949C" stroke-width="5" opacity=".55" stroke-linecap="round"/>
    <path d="M206 472H594L578 506H222Z" fill="#2A353D"/>
    <path d="M206 472H594" stroke="#4A5A63" stroke-width="3" opacity=".8"/>

    <!-- 内壁：后、左、右、前四面 -->
    <path d="M266 308H534L518 328H282Z" fill="#B9A88C"/>
    <path d="M266 308L282 328L250 444L234 456Z" fill="#D8C7AD"/>
    <path d="M534 308L518 328L548 444L566 456Z" fill="#D8C7AD"/>
    <path d="M250 444H548L566 456H234Z" fill="#C4B296"/>
    <path d="M266 308H534" stroke="#F7F1E4" stroke-width="3" opacity=".75"/>
    <path d="M282 328L250 444" stroke="#F7F1E4" stroke-width="2" opacity=".55"/>
    <path d="M518 328L548 444" stroke="#A99478" stroke-width="3" opacity=".45"/>
    <path d="M250 444H548" stroke="#A99478" stroke-width="3" opacity=".55"/>

    <!-- 内底 -->
    <path d="M282 328H518L548 444H250Z" fill="#EDE6D6"/>
    <path d="M282 328H518" stroke="#A99478" stroke-width="4" opacity=".35"/>
    <path d="M282 328L250 444M518 328L548 444" stroke="#A99478" stroke-width="2" opacity=".25"/>

    <!-- 有厚度的分格内壁 -->
    <path d="M438 328L456 444" stroke="#F7F1E4" stroke-width="4" stroke-linecap="round"/>
    <path d="M438 328L456 444L464 442L446 326Z" fill="#CBBBA2"/>
    <path d="M464 442L446 326" stroke="#A99478" stroke-width="2" opacity=".55"/>
    <path d="M438 386H536" stroke="#F7F1E4" stroke-width="4" stroke-linecap="round"/>
    <path d="M438 386H536L534 393H438Z" fill="#CBBBA2"/>
    <path d="M438 393H534" stroke="#A99478" stroke-width="2" opacity=".5"/>

    <!-- 左格：米饭 + 梅干 + 海苔 -->
    <g>
      <ellipse cx="342" cy="396" rx="80" ry="44" fill="#DFD3BC"/>
      <ellipse cx="342" cy="388" rx="78" ry="41" fill="url(#rice)"/>
      <path d="M286 372c29-17 70-20 96-5" fill="none" stroke="#FFFFFF" stroke-width="5" opacity=".5" stroke-linecap="round"/>
      <g fill="none" stroke="#D6C9B1" stroke-width="2" stroke-linecap="round" opacity=".6">
        <path d="M300 388c7-4 15-4 22 0M326 366c8-4 17-4 25 0M360 378c7-4 16-4 23 0M374 408c7-3 15-2 21 2"/>
      </g>
      <g fill="#E7DCC4" opacity=".85">
        <circle cx="292" cy="386" r="3.5"/><circle cx="316" cy="368" r="3"/><circle cx="346" cy="358" r="3.5"/>
        <circle cx="378" cy="374" r="3"/><circle cx="392" cy="398" r="3.5"/><circle cx="362" cy="416" r="3"/>
      </g>
      <!-- 海苔片 -->
      <path d="M270 400c10-3 20-2 28 2l-4 24c-9-4-18-5-27-2z" fill="#2E4637"/>
      <path d="M275 404c6-1 12 0 17 3" fill="none" stroke="#6F8C5B" stroke-width="2" opacity=".6"/>
      <!-- 梅干 -->
      <circle cx="306" cy="376" r="9" fill="#B8443A"/>
      <path d="M302 371c3-3 6-3 9-1" fill="none" stroke="#D97A68" stroke-width="2" opacity=".8" stroke-linecap="round"/>
      <g fill="#5E6E52" opacity=".7">
        <circle cx="330" cy="410" r="1.4"/><circle cx="352" cy="400" r="1.3"/><circle cx="382" cy="412" r="1.3"/>
      </g>
    </g>

    <!-- 右上格：生菜上的炸鸡块和柠檬 -->
    <g>
      <path d="M454 352c10-14 30-16 40-4 8-10 26-8 30 4 4 12-8 20-26 20-18 0-36-6-44-20z" fill="#6F9D5A"/>
      <path d="M470 344c-2-10 12-16 20-8 5-8 18-4 15 6-3 9-18 13-26 9-4-2-8-4-9-7z" fill="#C98A3E"/>
      <path d="M496 358c-2-8 10-13 16-6 4-6 15-2 13 5-2 8-15 11-21 8-4-1-7-4-8-7z" fill="#D99A4B"/>
      <path d="M514 338c-1-7 8-11 13-6 4-5 12-2 11 4-1 7-11 10-16 7-4-1-7-3-8-5z" fill="#E0A653"/>
      <g fill="#F0D29A" opacity=".75">
        <circle cx="478" cy="338" r="2.5"/><circle cx="504" cy="352" r="2.5"/><circle cx="520" cy="334" r="2"/>
      </g>
      <path d="M512 352c8-5 16 0 14 7-2 6-10 8-15 3-3-4-3-7 1-10z" fill="#E8C94E"/>
      <path d="M515 354c3-2 6-1 7 2" fill="none" stroke="#F5E38C" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- 右下格：玉子烧、西兰花、小番茄 -->
    <g>
      <rect x="448" y="398" width="42" height="18" rx="6" fill="#E8B84E"/>
      <path d="M452 404h34M452 410h34" stroke="#D19A36" stroke-width="2" opacity=".8"/>
      <circle cx="508" cy="412" r="11" fill="#5E8B50"/>
      <circle cx="526" cy="424" r="10" fill="#6F9D5A"/>
      <circle cx="520" cy="402" r="9" fill="#7FA866"/>
      <g fill="#93BC78">
        <circle cx="508" cy="412" r="4.5"/><circle cx="526" cy="424" r="4"/><circle cx="520" cy="402" r="3.8"/>
      </g>
      <circle cx="466" cy="432" r="8" fill="#D8503E"/>
      <circle cx="534" cy="438" r="7" fill="#C84434"/>
      <path d="M466 426l3-4M466 426l-4-3M534 433l3-4M534 433l-4-3" stroke="#5E8B50" stroke-width="2" stroke-linecap="round"/>
      <g fill="#F5E38C" opacity=".75">
        <circle cx="492" cy="404" r="1.5"/><circle cx="500" cy="430" r="1.5"/>
      </g>
    </g>
  </g>

  <!-- 筷子：右撇子，筷尖搭在盒右沿，筷柄落在桌面 -->
  <path d="M558 362L706 460" fill="none" stroke="#120D0A" stroke-width="10" opacity=".16" stroke-linecap="round"/>
  <path d="M570 350L718 448" fill="none" stroke="#120D0A" stroke-width="10" opacity=".13" stroke-linecap="round"/>
  <g stroke-linecap="round">
    <path d="M552 352L700 450" stroke="#B48859" stroke-width="7"/>
    <path d="M564 340L712 438" stroke="#C69C6A" stroke-width="7"/>
    <path d="M552 352L700 450" stroke="#E2C297" stroke-width="2.5" opacity=".55"/>
    <path d="M564 340L712 438" stroke="#EED0A6" stroke-width="2.5" opacity=".55"/>
  </g>

  <rect width="800" height="600" filter="url(#grain)" opacity=".13" style="mix-blend-mode:soft-light"/>
  <rect width="800" height="600" fill="#0B1112" opacity=".03"/>
</svg>


