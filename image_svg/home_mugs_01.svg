<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title desc">
  <title id="title">桌上的两只杯子</title>
  <desc id="desc">木质桌面上并排放着两只马克杯，一只是深绿色，一只是米白色，杯口冒着热气，旁边有一把勺子。</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EDE5D6"/>
      <stop offset="1" stop-color="#DDD1BE"/>
    </linearGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C99B6B"/>
      <stop offset="1" stop-color="#A67549"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3E5C4A"/>
      <stop offset=".45" stop-color="#58755F"/>
      <stop offset="1" stop-color="#2E4839"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E8DDC7"/>
      <stop offset=".45" stop-color="#FBF4E6"/>
      <stop offset="1" stop-color="#D8C9B0"/>
    </linearGradient>
    <radialGradient id="steam" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".13"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#wall)"/>
  <rect y="330" width="800" height="270" fill="url(#table)"/>
  <path d="M0 330h800v12H0z" fill="#E2C7A2" opacity=".55"/>
  <g stroke="#8C5B34" stroke-width="3" opacity=".2">
    <path d="M0 406h800M0 500h800M120 330v270M420 330v270M650 330v270"/>
  </g>
  <ellipse cx="400" cy="515" rx="300" ry="46" fill="#5E3E25" opacity=".22" filter="url(#soft)"/>

  <!-- 深绿色杯子 -->
  <g>
    <ellipse cx="320" cy="505" rx="105" ry="20" fill="#4B2F1B" opacity=".3" filter="url(#soft)"/>
    <path d="M225 360h190v105q0 55-95 55t-95-55z" fill="url(#green)"/>
    <ellipse cx="320" cy="360" rx="95" ry="25" fill="#6D8A72"/>
    <ellipse cx="320" cy="360" rx="79" ry="17" fill="#2A3F33"/>
    <ellipse cx="320" cy="361" rx="67" ry="12" fill="#4A3325"/>
    <path d="M415 383c40-4 58 18 58 42s-20 43-55 43" fill="none" stroke="#3E5C4A" stroke-width="18" stroke-linecap="round"/>
    <path d="M415 383c40-4 58 18 58 42s-20 43-55 43" fill="none" stroke="#769080" stroke-width="5" stroke-linecap="round" opacity=".45"/>
    <path d="M245 389v58" stroke="#789080" stroke-width="8" stroke-linecap="round" opacity=".35"/>
    <ellipse cx="320" cy="505" rx="80" ry="11" fill="#263B2F" opacity=".8"/>
  </g>

  <!-- 米白色杯子 -->
  <g>
    <ellipse cx="520" cy="520" rx="96" ry="19" fill="#4B2F1B" opacity=".3" filter="url(#soft)"/>
    <path d="M435 394h170v92q0 50-85 50t-85-50z" fill="url(#cream)"/>
    <ellipse cx="520" cy="394" rx="85" ry="22" fill="#F5ECDC"/>
    <ellipse cx="520" cy="394" rx="70" ry="15" fill="#C8B69C"/>
    <ellipse cx="520" cy="395" rx="59" ry="10" fill="#6B4B35"/>
    <path d="M605 414c36-4 52 16 52 37s-18 38-49 38" fill="none" stroke="#DACCB4" stroke-width="16" stroke-linecap="round"/>
    <path d="M605 414c36-4 52 16 52 37s-18 38-49 38" fill="none" stroke="#FFF7EA" stroke-width="4" stroke-linecap="round" opacity=".55"/>
    <path d="M453 421v51" stroke="#FFF8EC" stroke-width="7" stroke-linecap="round" opacity=".65"/>
    <ellipse cx="520" cy="520" rx="72" ry="10" fill="#BCA98D" opacity=".8"/>
    <path d="M472 456q22 12 44 0" fill="none" stroke="#B99C77" stroke-width="3" opacity=".36"/>
  </g>

  <!-- 热气 -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" opacity=".4">
    <path d="M286 330c-14-25 16-36 2-62M318 324c-12-22 14-33 3-56M350 331c-12-21 14-32 2-54" stroke-width="6"/>
    <path d="M488 365c-12-20 13-31 2-52M518 360c-10-18 12-28 2-47M548 366c-10-18 11-27 1-44" stroke-width="5" opacity=".7"/>
  </g>
  <g fill="url(#steam)">
    <ellipse cx="320" cy="294" rx="90" ry="58"/>
    <ellipse cx="520" cy="336" rx="78" ry="50"/>
  </g>

  <!-- 勺子 -->
  <g transform="translate(654 478) rotate(-18)">
    <ellipse cx="0" cy="0" rx="22" ry="12" fill="#D8D3C8"/>
    <path d="M16 0h74" stroke="#B9B3A7" stroke-width="7" stroke-linecap="round"/>
    <ellipse cx="0" cy="-3" rx="16" ry="6" fill="#F1EEE6" opacity=".7"/>
  </g>

  <rect width="800" height="600" filter="url(#grain)" opacity=".12" style="mix-blend-mode:soft-light"/>
</svg>
