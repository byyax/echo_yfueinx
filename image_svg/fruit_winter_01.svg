<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title desc">
  <title id="title">冬日水果</title>
  <desc id="desc">俯视的奶油色窗格纹桌布上，一大盘冬日水果：橙子、苹果、香蕉、葡萄和猕猴桃。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EFE3CF"/>
      <stop offset="1" stop-color="#DCC8AE"/>
    </linearGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7A543A"/>
      <stop offset="1" stop-color="#4A3122"/>
    </linearGradient>
    <radialGradient id="orange" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#F2B250"/>
      <stop offset=".7" stop-color="#E8902E"/>
      <stop offset="1" stop-color="#C96E20"/>
    </radialGradient>
    <radialGradient id="apple" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#E86A58"/>
      <stop offset=".7" stop-color="#C84434"/>
      <stop offset="1" stop-color="#9A2F26"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".14"/></feComponentTransfer>
    </filter>
  </defs>

  <!-- 俯视：奶油色窗格纹桌布 -->
  <rect width="800" height="600" fill="#EADCC6"/>
  <g stroke="#DCCCB4" stroke-width="3" opacity=".45">
    <path d="M0 75H800M0 150H800M0 225H800M0 300H800M0 375H800M0 450H800M0 525H800"/>
    <path d="M100 0V600M200 0V600M300 0V600M400 0V600M500 0V600M600 0V600M700 0V600"/>
  </g>
  <g stroke="#C98A6A" stroke-width="2" opacity=".35">
    <path d="M0 110H800M0 260H800M0 410H800M0 560H800"/>
    <path d="M160 0V600M400 0V600M640 0V600"/>
  </g>
  <g stroke="#8FA080" stroke-width="8" opacity=".2">
    <path d="M0 185H800M0 335H800M0 485H800"/>
    <path d="M280 0V600M560 0V600"/>
  </g>

  <!-- 木盘 -->
  <ellipse cx="400" cy="358" rx="300" ry="168" fill="#1E120B" opacity=".3" filter="url(#soft)"/>
  <ellipse cx="400" cy="348" rx="300" ry="168" fill="#8A6246"/>
  <ellipse cx="400" cy="344" rx="272" ry="148" fill="#A97852"/>
  <ellipse cx="400" cy="344" rx="240" ry="126" fill="none" stroke="#6E4530" stroke-width="3" opacity=".6"/>

  <g transform="translate(400 344) scale(1.22) translate(-400 -344)">
  <!-- 橙子 -->
  <g>
    <circle cx="270" cy="290" r="66" fill="url(#orange)"/>
    <path d="M270 224c-2-12 8-20 16-22 2 10-4 18-16 22z" fill="#4D7145"/>
    <circle cx="362" cy="326" r="54" fill="#E8902E"/>
    <circle cx="362" cy="326" r="42" fill="#F2B250"/>
    <g stroke="#E8902E" stroke-width="2">
      <path d="M362 284v84M320 326h84M332 296l60 60M392 296l-60 60"/>
    </g>
    <circle cx="362" cy="326" r="6" fill="#F7E7CE"/>
  </g>

  <!-- 苹果 -->
  <g>
    <circle cx="470" cy="270" r="58" fill="url(#apple)"/>
    <path d="M470 212c-4-13 4-22 12-26 2 11-4 20-12 26z" fill="#4D7145"/>
    <path d="M470 216c-2-10 2-18 6-22" stroke="#5A3A26" stroke-width="4" stroke-linecap="round"/>
    <path d="M448 258c8-14 22-22 38-20" fill="none" stroke="#F2A090" stroke-width="4" opacity=".5" stroke-linecap="round"/>
  </g>

  <!-- 香蕉 -->
  <g transform="rotate(-8 560 370)">
    <path d="M520 346c44-28 96-22 126 14 14 18 12 42-4 52-8 4-16-2-16-12 0-24-20-44-48-50-20-4-38-2-54 2-6 2-10-2-4-6z" fill="#E8C94E"/>
    <path d="M520 346c44-28 96-22 126 14" fill="none" stroke="#C99A2E" stroke-width="3" opacity=".55"/>
  </g>

  <!-- 葡萄 -->
  <g>
    <path d="M544 408c-8 28 14 52 46 54 32 2 56-18 54-44" fill="none" stroke="#4D7145" stroke-width="5"/>
    <g fill="#6A3F5A">
      <circle cx="560" cy="412" r="13"/><circle cx="584" cy="404" r="13"/><circle cx="608" cy="412" r="13"/>
      <circle cx="570" cy="434" r="13"/><circle cx="594" cy="428" r="13"/><circle cx="618" cy="436" r="13"/>
      <circle cx="582" cy="454" r="13"/><circle cx="606" cy="454" r="13"/>
    </g>
    <g fill="#A87A9A" opacity=".55">
      <circle cx="556" cy="408" r="4"/><circle cx="580" cy="400" r="4"/><circle cx="604" cy="408" r="4"/>
      <circle cx="566" cy="430" r="4"/><circle cx="590" cy="424" r="4"/><circle cx="614" cy="432" r="4"/>
    </g>
  </g>

  <!-- 猕猴桃 -->
  <g>
    <circle cx="300" cy="410" r="48" fill="#8A6246"/>
    <circle cx="300" cy="410" r="42" fill="#8FAE4E"/>
    <circle cx="300" cy="410" r="32" fill="#B9D86A"/>
    <circle cx="300" cy="410" r="8" fill="#F7E7CE"/>
    <g fill="#2F3A22">
      <ellipse cx="300" cy="384" rx="2" ry="4"/><ellipse cx="300" cy="436" rx="2" ry="4"/>
      <ellipse cx="274" cy="410" rx="4" ry="2"/><ellipse cx="326" cy="410" rx="4" ry="2"/>
      <ellipse cx="282" cy="392" rx="3" ry="2" transform="rotate(45 282 392)"/>
      <ellipse cx="318" cy="392" rx="3" ry="2" transform="rotate(-45 318 392)"/>
      <ellipse cx="282" cy="428" rx="3" ry="2" transform="rotate(-45 282 428)"/>
      <ellipse cx="318" cy="428" rx="3" ry="2" transform="rotate(45 318 428)"/>
    </g>
    <circle cx="386" cy="438" r="34" fill="#8FAE4E"/>
    <circle cx="386" cy="438" r="27" fill="#B9D86A"/>
    <circle cx="386" cy="438" r="6" fill="#F7E7CE"/>
  </g>

  <!-- 松枝点缀 -->
  <g fill="#4D7145" opacity=".8">
    <path d="M210 376c-26-8-40-24-38-44 18 10 30 26 38 44z"/>
    <path d="M210 376c8-24 24-36 44-36-10 18-26 30-44 36z" fill="#5E8B50"/>
    <path d="M690 300c24-10 40-6 50 10-18 6-34 2-50-10z"/>
  </g>
  </g>

  <rect width="800" height="600" filter="url(#grain)" opacity=".15" style="mix-blend-mode:soft-light"/>
  <rect width="800" height="600" fill="#2B1A10" opacity=".06"/>
</svg>

