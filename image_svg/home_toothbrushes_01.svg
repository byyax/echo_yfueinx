<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title desc">
  <title id="title">洗手台上的两只牙刷</title>
  <desc id="desc">浴室洗手台上放着一只玻璃杯，里面插着深蓝色和浅粉色的两只牙刷，旁边有牙膏和叠好的毛巾。</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DDE7E7"/>
      <stop offset="1" stop-color="#C3D4D4"/>
    </linearGradient>
    <linearGradient id="counter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F1E9"/>
      <stop offset="1" stop-color="#D9D2C5"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D6E7E5" stop-opacity=".65"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".32"/>
      <stop offset="1" stop-color="#AFCBC8" stop-opacity=".6"/>
    </linearGradient>
    <linearGradient id="towel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FA6A0"/>
      <stop offset="1" stop-color="#6E8982"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".12"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#wall)"/>
  <g stroke="#B4C6C6" stroke-width="2" opacity=".55">
    <path d="M0 90h800M0 190h800M0 290h800"/>
    <path d="M130 0v340M320 0v340M510 0v340M700 0v340"/>
  </g>
  <rect y="338" width="800" height="262" fill="url(#counter)"/>
  <path d="M0 338h800v13H0z" fill="#FFFFFF" opacity=".75"/>
  <ellipse cx="390" cy="470" rx="270" ry="44" fill="#5A6B68" opacity=".18" filter="url(#soft)"/>

  <!-- 毛巾 -->
  <g>
    <rect x="78" y="382" width="184" height="118" rx="16" fill="url(#towel)"/>
    <path d="M78 410h184M78 438h184M78 466h184" stroke="#5D7770" stroke-width="3" opacity=".45"/>
    <path d="M98 382v118M240 382v118" stroke="#B4C7C0" stroke-width="4" opacity=".35"/>
    <path d="M80 496h180v14H80z" fill="#5B746D" opacity=".5"/>
  </g>

  <!-- 玻璃杯与牙刷 -->
  <g>
    <path d="M286 306h190l-14 164q-2 22-24 22h-114q-22 0-24-22z" fill="url(#glass)" stroke="#FFFFFF" stroke-width="3" opacity=".95"/>
    <path d="M298 330h166l-9 116" fill="none" stroke="#FFFFFF" stroke-width="8" opacity=".45"/>
    <ellipse cx="381" cy="307" rx="95" ry="20" fill="#FFFFFF" opacity=".3"/>
    <ellipse cx="381" cy="307" rx="84" ry="13" fill="#B8D2CF" opacity=".38"/>

    <!-- 深蓝牙刷 -->
    <g transform="translate(342 302) rotate(-14)">
      <path d="M-12 0h24l-3-178h-18z" fill="#34516E"/>
      <path d="M-10 0h8l-2-176h-5z" fill="#6F8AA3" opacity=".55"/>
      <rect x="-15" y="-196" width="30" height="42" rx="12" fill="#2A455F"/>
      <g stroke="#DCE8ED" stroke-width="2" opacity=".85">
        <path d="M-9-188v22M-3-190v24M3-190v24M9-188v22"/>
      </g>
    </g>

    <!-- 浅粉牙刷 -->
    <g transform="translate(420 304) rotate(10)">
      <path d="M-12 0h24l-3-168h-18z" fill="#D49A9A"/>
      <path d="M-10 0h8l-2-166h-5z" fill="#F3CBC8" opacity=".7"/>
      <rect x="-15" y="-186" width="30" height="40" rx="12" fill="#C98282"/>
      <g stroke="#FFF4F2" stroke-width="2" opacity=".9">
        <path d="M-9-178v21M-3-180v23M3-180v23M9-178v21"/>
      </g>
    </g>

    <path d="M286 430h182" stroke="#FFFFFF" stroke-width="4" opacity=".3"/>
  </g>

  <!-- 牙膏 -->
  <g transform="translate(574 456) rotate(-8)">
    <rect x="-48" y="-20" width="96" height="40" rx="16" fill="#EEF1E9"/>
    <rect x="-38" y="-14" width="62" height="28" rx="11" fill="#9BB5A5"/>
    <rect x="38" y="-12" width="22" height="24" rx="6" fill="#7D9688"/>
    <rect x="54" y="-9" width="14" height="18" rx="5" fill="#DDE3DA"/>
    <path d="M-32 -3h46" stroke="#FFFFFF" stroke-width="3" opacity=".7"/>
  </g>

  <rect width="800" height="600" filter="url(#grain)" opacity=".1" style="mix-blend-mode:soft-light"/>
</svg>
