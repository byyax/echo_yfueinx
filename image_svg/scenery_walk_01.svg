<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title desc">
  <title id="title">傍晚的公园散步</title>
  <desc id="desc">傍晚的公园里，一条碎石小路穿过草地通向远处，路边有长椅、路灯和高大的树，一个人正沿着小路往前走。</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6DDAA"/>
      <stop offset=".55" stop-color="#EFC487"/>
      <stop offset="1" stop-color="#D79A67"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCC49C"/>
      <stop offset="1" stop-color="#A77A52"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#738B53"/>
      <stop offset="1" stop-color="#3E5232"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFF8D8" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#FFE3A5" stop-opacity=".35"/>
      <stop offset="1" stop-color="#FFE3A5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="leaf" cx="38%" cy="30%" r="72%">
      <stop offset="0" stop-color="#99AC61"/>
      <stop offset=".7" stop-color="#637B44"/>
      <stop offset="1" stop-color="#3D522E"/>
    </radialGradient>
    <radialGradient id="leafDark" cx="35%" cy="30%" r="72%">
      <stop offset="0" stop-color="#6F8748"/>
      <stop offset="1" stop-color="#2F4227"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".88" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".15"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="620" cy="132" r="170" fill="url(#sun)"/>
  <circle cx="620" cy="132" r="34" fill="#FFF7D4" opacity=".8"/>

  <!-- 远处树线和草地 -->
  <path d="M0 344c52-42 110-48 160-18 44-34 100-28 138 6 50-24 108-12 138 22 46-20 96-6 122 24 38-18 82-4 102 20H0z" fill="#657B4A" opacity=".75"/>
  <path d="M0 360h800v240H0z" fill="url(#grass)"/>
  <path d="M0 360c150 18 280 20 420 6 120-12 240-10 380 10v20c-140-18-260-20-380-8-140 14-270 12-420-6z" fill="#8FA363" opacity=".35"/>

  <!-- 碎石小路：近宽远窄 -->
  <path d="M160 600C238 516 316 442 370 352H430C484 442 562 516 640 600Z" fill="url(#path)"/>
  <path d="M160 600C238 516 316 442 370 352M640 600C562 516 484 442 430 352" fill="none" stroke="#E3C9A2" stroke-width="4" opacity=".55"/>
  <g stroke="#9A704D" stroke-width="2" opacity=".3">
    <path d="M196 570h408M240 520h320M294 464h212M342 412h116M368 372h64"/>
  </g>
  <g fill="#8C6547" opacity=".45">
    <ellipse cx="360" cy="540" rx="9" ry="3"/><ellipse cx="440" cy="500" rx="7" ry="2.5"/>
    <ellipse cx="388" cy="452" rx="6" ry="2"/><ellipse cx="414" cy="408" rx="5" ry="2"/>
  </g>

  <!-- 左侧大树 -->
  <g>
    <path d="M104 600c2-96 10-174 26-252l28 5c-6 82-8 166-4 247z" fill="#4B3527"/>
    <path d="M128 468c-26-24-52-38-86-48M136 432c28-26 50-42 78-54M122 512c-24-14-46-20-68-22" fill="none" stroke="#4B3527" stroke-width="10" stroke-linecap="round"/>
    <g>
      <circle cx="42" cy="270" r="88" fill="url(#leafDark)"/>
      <circle cx="132" cy="212" r="108" fill="url(#leaf)"/>
      <circle cx="224" cy="282" r="82" fill="url(#leafDark)"/>
      <circle cx="120" cy="336" r="92" fill="url(#leaf)"/>
      <circle cx="36" cy="370" r="58" fill="url(#leafDark)"/>
      <circle cx="206" cy="372" r="52" fill="url(#leafDark)"/>
    </g>
    <g fill="#C9D48D" opacity=".35">
      <circle cx="92" cy="202" r="16"/><circle cx="166" cy="244" r="11"/><circle cx="58" cy="318" r="9"/>
    <path d="M100 600c10-18 24-28 42-30l8 8c-18 4-32 10-44 22z" fill="#4B3527"/>
    <path d="M128 600c8-14 20-22 34-24l6 8c-14 2-26 8-34 16z" fill="#4B3527"/>
    </g>
  </g>

  <!-- 右侧大树 -->
  <g>
    <path d="M690 600c-2-84-8-152-20-218l24-4c16 66 24 140 26 222z" fill="#463327"/>
    <path d="M698 458c-18-20-36-32-58-40M708 430c20-18 36-28 54-36" fill="none" stroke="#463327" stroke-width="9" stroke-linecap="round"/>
    <g>
      <circle cx="700" cy="322" r="82" fill="url(#leaf)"/>
      <circle cx="770" cy="378" r="54" fill="url(#leafDark)"/>
      <circle cx="640" cy="366" r="54" fill="url(#leafDark)"/>
      <circle cx="736" cy="268" r="58" fill="url(#leafDark)"/>
    </g>
    <g fill="#C9D48D" opacity=".3">
      <circle cx="712" cy="296" r="12"/><circle cx="764" cy="358" r="8"/>
    <path d="M690 600c8-16 20-24 36-26l7 8c-15 3-27 9-37 18z" fill="#463327"/>
    <path d="M716 600c7-12 17-19 29-21l5 8c-12 2-22 7-29 13z" fill="#463327"/>
    </g>
  </g>

  <!-- 长椅：侧面，面向人行道 -->
  <g>
    <ellipse cx="138" cy="506" rx="86" ry="16" fill="#2C2119" opacity=".35" filter="url(#soft)"/>
    <path d="M58 416h20v72H58z" fill="#7A5436"/>
    <path d="M62 420h12v64H62z" fill="#946844" opacity=".55"/>
    <path d="M72 472h128v14H72z" fill="#7A5436"/>
    <path d="M72 486h128v12H72z" fill="#5B3D27"/>
    <path d="M70 452h132v10H70z" fill="#6A472E"/>
    <path d="M190 452v24" stroke="#5B3D27" stroke-width="8"/>
    <path d="M80 498l-6 34M190 498l6 34" stroke="#2D2923" stroke-width="7" stroke-linecap="round"/>
    <path d="M58 416h20" stroke="#946844" stroke-width="3" opacity=".6"/>
  </g>

  <!-- 路灯 -->
  <g>
    <path d="M592 496V292" stroke="#3A332B" stroke-width="11" stroke-linecap="round"/>
    <path d="M592 298c0-22-16-32-38-32h-24" fill="none" stroke="#3A332B" stroke-width="8" stroke-linecap="round"/>
    <path d="M520 266h46l-7 38h-32z" fill="#4A4035"/>
    <path d="M526 269h34l-5 27h-24z" fill="#FFE4A2" opacity=".8"/>
    <circle cx="544" cy="286" r="48" fill="#FFD98C" opacity=".2" filter="url(#soft)"/>
    <ellipse cx="592" cy="507" rx="28" ry="8" fill="#2C2119" opacity=".4" filter="url(#soft)"/>
  </g>

  <!-- 道路两侧的小树 -->
  <g>
    <path d="M316 430v-38" stroke="#4B3527" stroke-width="8" stroke-linecap="round"/>
    <circle cx="304" cy="370" r="24" fill="url(#leafDark)"/>
    <circle cx="326" cy="382" r="20" fill="url(#leaf)"/>
    <circle cx="292" cy="388" r="18" fill="url(#leaf)"/>
    <path d="M306 430c4-8 12-12 22-14l4 6c-9 2-16 5-21 9z" fill="#4B3527"/>
    <path d="M480 430v-36" stroke="#4B3527" stroke-width="8" stroke-linecap="round"/>
    <circle cx="470" cy="374" r="22" fill="url(#leafDark)"/>
    <circle cx="492" cy="386" r="18" fill="url(#leaf)"/>
    <circle cx="458" cy="390" r="16" fill="url(#leaf)"/>
    <path d="M470 430c4-8 12-12 22-14l4 6c-9 2-16 5-21 9z" fill="#4B3527"/>
  </g>
  <!-- 垃圾桶和路牌 -->
  <g>
    <rect x="500" y="470" width="38" height="56" rx="5" fill="#4C5A46"/>
    <path d="M496 470h46v8h-46z" fill="#394536"/>
    <path d="M510 456h18" stroke="#394536" stroke-width="5" stroke-linecap="round"/>
    <path d="M250 430v82" stroke="#5B3D27" stroke-width="8" stroke-linecap="round"/>
    <path d="M218 430h74l-10 26h-54z" fill="#D9CEB8"/>
    <path d="M232 438h40" stroke="#5B3D27" stroke-width="4" opacity=".6"/>
  </g>


  <!-- 落叶与光斑 -->
  <g fill="#D2A354">
    <path d="M540 260c10-15 26-14 28-3 2 12-15 22-26 17-9-4-9-8-2-14z" opacity=".7"/>
    <path d="M468 186c7-11 19-10 21-2 1 9-11 16-19 12-6-2-6-6-2-10z" opacity=".55"/>
    <path d="M612 360c8-12 20-11 22-2 1 9-12 17-20 12-6-3-6-6-2-10z" opacity=".55"/>
  </g>
  <g fill="#FFE2A0" opacity=".18" filter="url(#soft)">
    <ellipse cx="256" cy="262" rx="70" ry="22" transform="rotate(-24 256 262)"/>
    <ellipse cx="524" cy="198" rx="50" ry="17" transform="rotate(-18 524 198)"/>
  </g>

  <rect width="800" height="600" filter="url(#grain)" opacity=".14" style="mix-blend-mode:soft-light"/>
  <rect width="800" height="600" fill="#4E2F1D" opacity=".05"/>
</svg>




